                - paragraph [ref=e137]:
                  - strong [ref=e138]: "Überblick:"
                  - text: Molekülorbitale = delokalisiert über ganze Molekül
                - paragraph [ref=e139]:
                  - strong [ref=e140]: "Grundprinzip:"
                  - text: Orbital-Überlapp kombiniert Atomorbitale (AOs) linear zu Molekülorbitalen (MOs)
                - paragraph [ref=e141]:
                  - strong [ref=e142]: "Energieniveauschema:"
                - list [ref=e143]:
                  - listitem [ref=e144]: "Gebundende MOs: Energieniedrig, stabilisieren Molekül"
                  - listitem [ref=e145]: "Antibindende MOs: Energiereich, destabilisieren Molekül"
                  - listitem [ref=e146]: Elektronen besitzen die niedrigste Energie MOs zuerst
                - paragraph [ref=e147]:
                  - strong [ref=e148]: "Vorteile:"
                - list [ref=e149]:
                  - listitem [ref=e150]: Anorganische Komplexe (z.B. Koordinationsverbindungen) besser erklärt
                  - listitem [ref=e151]: Delokalisierung in π-Systemen (Aromaten, Konjugation) verständlich
                  - listitem [ref=e152]: Einfacher aus Symmetriegruppen heraus Informationen ableiten
                - paragraph [ref=e153]:
                  - strong [ref=e154]: "Nachteile:"
                - list [ref=e155]:
                  - listitem [ref=e156]: Klassische organische Mechanismen intuitiv schwerer zu verstehen
                  - listitem [ref=e157]: Geometriebedingungen (109.5° vs linear) sind keine direkten Ausgangspunkte
              - generic [ref=e159]:
                - heading "🧠 Valenzbindungs-Theorie (VB)" [level=3] [ref=e160]
                - paragraph [ref=e161]:
                  - strong [ref=e162]: "Überblick:"
                  - text: Lokalisierte Bindung zwischen zwei Atomkernen
                - paragraph [ref=e163]:
                  - strong [ref=e164]: "Grundprinzip:"
                  - text: Hybridisierung (mischen s, p, d) → neue Hybridorbitale, die binden
