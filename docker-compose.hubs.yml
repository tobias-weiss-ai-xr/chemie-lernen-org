# Hubs (Mozilla Hubs) stack — deployed on the chemie-lernen.org host.
#
# Reuses the already-built images from the prior /opt/containers/hubs-compose
# deployment (hubs-compose-reticulum / hubs-compose-hubs-client / …) and the
# existing DATA volumes (pgdata, retstorage, letsencrypt, source volumes).
# TLS for hubs.chemie-lernen.org is terminated by the host Traefik
# (mytlschallenge). The app source lives in the old mutagen sync volumes
# (hubs-compose_hubs/_spoke/_dialog); node_modules are installed at deploy
# time via `docker compose run --rm`.
#
# Routing mirrors the main docker-compose.yml: services sit on `traefik-public`
# (the network Traefik's docker provider watches) plus an internal `hubs-net`.
#
# RAM budget: host has 16G (no swap). Totals below ≈ 3.8G, leaving headroom
# for neo4j/kg (2G) + chat-api/hugo (0.5G) + observability.
#
# OPENVZ / Virtuozzo constraints (this VE):
#  - netfilter `numiptent` (iptables-rule quota) is EXHAUSTED, so bridge+NAT
#    port publishing cannot be used for media (see hubs-dialog: network_mode: host).
#    => DO NOT add `ports:` to hubs services — each published port burns numiptent.
#       Route via Traefik (traefik-public) or use `network_mode: host`.
#  - Kernel sysctl (net.core.somaxconn, rmem_max/wmem_max, tcp_rmem/wmem, …) is
#    NOT writeable from inside the VE. Raise those at the hardware node instead.

x-logging: &hubs-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:14-alpine
    container_name: hubs-db
    restart: unless-stopped
    logging: *hubs-logging
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    mem_limit: 512m
    # NOTE: this Virtuozzo VE disables CPU *quota* (hard caps are dropped,
    # CpuQuota stays 0), so limits.cpus/reservations.cpus are no-ops. Only
    # relative cpu_shares (priority under contention) are honored -> use that.
    cpu_shares: 1536
    deploy:
      resources:
        limits:
          memory: 512m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ret_dev
    command:
      - "postgres"
      - "-c"
      - "wal_compression=on"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "effective_cache_size=384MB"
      - "-c"
      - "max_wal_size=1GB"
      - "-c"
      - "min_wal_size=80MB"
      - "-c"
      - "max_connections=150"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - hubs-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  hubs-postgrest:
    image: hubs-compose-postgrest:latest
    container_name: hubs-postgrest
    restart: unless-stopped
    logging: *hubs-logging
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    mem_limit: 256m
    cpu_shares: 512
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      - hubs-net

  hubs-reticulum:
    image: hubs-compose-reticulum:latest
    container_name: hubs-reticulum
    restart: unless-stopped
    logging: *hubs-logging
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    stop_grace_period: 30s
    mem_limit: 1g
    cpu_shares: 2048
    deploy:
      resources:
        limits:
          memory: 1g
    depends_on:
      - db
    environment:
      HTTPS_CERT_FULLCHAIN: /code/certs/live/hubs.chemie-lernen.org/fullchain.pem
      HTTPS_CERT_PRIVKEY: /code/certs/live/hubs.chemie-lernen.org/privkey.pem
      DB_CREDENTIALS: postgres
      DB_HOST: db
      DIALOG_HOSTNAME: "hubs.chemie-lernen.org"
      DIALOG_PORT: 4443
      HUBS_ADMIN_INTERNAL_HOSTNAME: hubs-admin
      HUBS_CLIENT_INTERNAL_HOSTNAME: hubs-client
      POSTGREST_INTERNAL_HOSTNAME: hubs-postgrest
      SPOKE_INTERNAL_HOSTNAME: spoke
      TURKEY_MODE: "1"
      ERL_FLAGS: "+sbwtvery_long +sbwtdcpuvery_long +swtvery_low +A 32 +P 5000000 +Q 5000000 +e 500000"
      # RSA key used to sign PermsTokens (RS512) — must match dialog's AUTH_KEY (/etc/perms.pub.pem)
      PERMS_KEY: |-
        -----BEGIN RSA PRIVATE KEY-----
        MIIEowIBAAKCAQEAmsUJ7e3Jc++A/DTD/QaSvkltyRvyPDr2WUqzsiKLIqNKWltn
        BGAyVptvxs+TJdR2wBNdKCjRh7X5wBsTw34tNpmQHEcD/H4ZCyyEmMNPnH95wDXn
        9DNs1V2C3rHBFFSRRrf9Q7U5D4SqEMsJ4HCxiC/67QMtlaoTq8VQQ5K1ZaTYV+hX
        A+Gz1/3GjbgaMf8uKfLSraos0wFHLmTzF/Z+pG3V08pv2RZDkhUahJF59cTBDa1m
        MmBfVXd1dldebeVMEPiG4p1rOal4SzAAqnjaovr79U3kFoVM2j6XFjGfpeDrt+Cx
        Dff2K5MFXv1ez7/mE47hphXlcEohQffag1iLEwIDAQABAoIBAG5OYs5N/JeBqqeW
        H91Vcv7mLLX6EgJ1b6CiSkJ6tjmAsfyGSnzm5tmtPNQwm0qKC/zHkEyQEw4rV45g
        fgyGAEl61yggQSoS4VyCZRrPkQ0UGb0xblkw0a+cTyrS+662uzfw6DP6lGmH/wGr
        BCYPi6hpseh8rF+P8ScqoRMYG+sNn1YrG9Js6krJifpMkuEmbeH6ZO2U/MaO4hlm
