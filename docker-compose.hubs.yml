        cWvLPwtCseBAqnvKRBAcC54ZKWPSug34v1aUReO/VV3d4YTNWM2X
        -----END RSA PRIVATE KEY-----
      RELEASE_CONFIG_DIR: "/ret"
      RELEASE_MUTABLE_DIR: "/ret/var"
      HOME: "/ret/var"
      REPLACE_OS_VARS: "true"
      POD_IP: "127.0.0.1"
      NODE_NAME: "127.0.0.1"
    command: bash -c 'exec /ret/bin/ret start'
    volumes:
      - /opt/containers/hubs-compose/files/reticulum-config.toml:/ret/config.toml:ro
      - letsencrypt:/code/certs
      - retstorage:/code/storage/dev
    networks:
      - hubs-net
      - traefik-public
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4001/api/v1/meta"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.hubs-api.rule=Host(`hubs.chemie-lernen.org`) && (PathPrefix(`/api`) || PathPrefix(`/reticulum`) || PathPrefix(`/files`) || PathPrefix(`/socket`))"
      - "traefik.http.routers.hubs-api.entrypoints=websecure"
      - "traefik.http.routers.hubs-api.tls=true"
      - "traefik.http.routers.hubs-api.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.hubs-api.priority=120"
      - "traefik.http.services.hubs-api.loadbalancer.server.port=4001"
      - "traefik.http.services.hubs-api.loadbalancer.server.scheme=http"
      - "traefik.http.services.hubs-api.loadbalancer.passHostHeader=true"
      # Reuse Traefik->reticulum backend connections (idleConnTimeout 90s set in
      # dynamic/servers-transports.yml) to compensate the VE's net.core.somaxconn=128.
      - "traefik.http.services.hubs-api.loadbalancer.serversTransport=hubs-https@file"
      - "traefik.http.serversTransports.hubs-https.insecureSkipVerify=true"

  hubs-client:
    image: hubs-compose-hubs-client:latest
    container_name: hubs-client
    restart: unless-stopped
    logging: *hubs-logging
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    mem_limit: 3g
    cpu_shares: 512
    deploy:
      resources:
        limits:
          memory: 3g
    # Serve the production build (dist/) statically instead of the
    # webpack-dev-server. This removes the dev-server status websocket
    # (wss://...:8080/ws) noise, the [webpack-dev-server] console spam, and
    # the dev-server process crashes / core dumps. dist/ is produced by
    # `webpack --mode=production` (see deploy step / manual build).
    command: python3 /code/static-server.py
    environment:
      INTERNAL_HOSTNAME: hubs-client
      PORT: "8080"
      HUBS_DIST: "/code/dist"
      # Point the production client build at the self-hosted reticulum instead of
      # Hubs' default dev.reticulum.io (which has an invalid cert and breaks
      # media search). Baked into the bundle via webpack DefinePlugin.
      RETICULUM_SERVER: "hubs.chemie-lernen.org"
      RETICULUM_SOCKET_SERVER: "hubs.chemie-lernen.org"
    volumes:
      - hubs-compose_hubs:/code
      - letsencrypt:/code/certs
      # Override the three missing/misconfigured static assets served from
      # /code/dist (no full client rebuild needed). Closes the browser console
      # warnings: favicon 404, manifest icon-size, no-op SW fetch handler.
      - /opt/git/hubs-client-assets/favicon.ico:/code/dist/favicon.ico:ro
      - /opt/git/hubs-client-assets/manifest.webmanifest:/code/dist/manifest.webmanifest:ro
      - /opt/git/hubs-client-assets/hub.service.js:/code/dist/hub.service.js:ro
    working_dir: /code
    networks:
      - hubs-net
      - traefik-public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      start_period: 4m
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.hubs-root.rule=Host(`hubs.chemie-lernen.org`)"
      - "traefik.http.routers.hubs-root.entrypoints=websecure"
      - "traefik.http.routers.hubs-root.tls=true"
      - "traefik.http.routers.hubs-root.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.hubs-root.priority=100"
      - "traefik.http.services.hubs-root.loadbalancer.server.port=8080"
      - "traefik.http.services.hubs-root.loadbalancer.server.scheme=http"
      - "traefik.http.serversTransports.hubs-https.insecureSkipVerify=true"

  hubs-admin:
    image: hubs-compose-hubs-admin:latest
    container_name: hubs-admin
    restart: unless-stopped
    logging: *hubs-logging
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    mem_limit: 2g
    cpu_shares: 512
    deploy:
      resources:
        limits:
          memory: 2g
    command: npm run local
    environment:
      INTERNAL_HOSTNAME: hubs-admin
    volumes:
      - hubs-compose_hubs:/code
      - letsencrypt:/code/certs
    working_dir: /code/admin
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:8989/admin/admin.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    networks:
      - hubs-net
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.hubs-admin.rule=Host(`hubs.chemie-lernen.org`) && PathPrefix(`/admin`)"
      - "traefik.http.routers.hubs-admin.entrypoints=websecure"
      - "traefik.http.routers.hubs-admin.tls=true"
      - "traefik.http.routers.hubs-admin.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.hubs-admin.priority=110"
      - "traefik.http.services.hubs-admin.loadbalancer.server.port=8989"
      - "traefik.http.services.hubs-admin.loadbalancer.server.scheme=https"
      - "traefik.http.services.hubs-admin.loadbalancer.serversTransport=hubs-https@file"
      - "traefik.http.middlewares.hubs-admin-redirect.redirectRegex.regex=^https?://([^/]+)/admin/?$$"
      - "traefik.http.middlewares.hubs-admin-redirect.redirectRegex.replacement=https://$$1/admin/admin.html"
      - "traefik.http.middlewares.hubs-admin-redirect.redirectRegex.permanent=false"
      - "traefik.http.routers.hubs-admin.middlewares=hubs-admin-redirect"
      - "traefik.http.serversTransports.hubs-https.insecureSkipVerify=true"

  spoke:
    image: hubs-compose-spoke:latest
    container_name: hubs-spoke
    restart: unless-stopped
    logging: *hubs-logging
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    mem_limit: 1g
    cpu_shares: 512
    deploy:
      resources:
        limits:
          memory: 1g
    command: yarn start
    environment:
      CORS_PROXY_SERVER: "hubs.chemie-lernen.org"
      BASE_ASSETS_PATH: "/spoke/"
      ROUTER_BASE_PATH: "/spoke"
      INTERNAL_HOSTNAME: spoke
    volumes:
      - hubs-compose_spoke:/code
      - letsencrypt:/code/certs
    working_dir: /code
    networks:
      - hubs-net
      - traefik-public
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:9090/spoke/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.hubs-spoke.rule=Host(`hubs.chemie-lernen.org`) && PathPrefix(`/spoke`)"
      - "traefik.http.routers.hubs-spoke.entrypoints=websecure"
      - "traefik.http.routers.hubs-spoke.tls=true"
      - "traefik.http.routers.hubs-spoke.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.hubs-spoke.priority=110"
      - "traefik.http.routers.hubs-spoke.middlewares=hubs-spoke-redirect"
      - "traefik.http.services.hubs-spoke.loadbalancer.server.port=9090"
      - "traefik.http.services.hubs-spoke.loadbalancer.server.scheme=https"
      - "traefik.http.services.hubs-spoke.loadbalancer.serversTransport=hubs-https@file"
      - "traefik.http.serversTransports.hubs-https.insecureSkipVerify=true"
      - "traefik.http.middlewares.hubs-spoke-redirect.redirectregex.regex=https://(.*)/spoke$$"
      - "traefik.http.middlewares.hubs-spoke-redirect.redirectregex.replacement=https://$${1}/spoke/"

  hubs-dialog:
    image: hubs-compose-dialog:latest
    container_name: hubs-dialog
    restart: unless-stopped
    logging: *hubs-logging
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    stop_grace_period: 30s
    # Host networking avoids docker-proxied iptables DNAT rules. The Virtuozzo VE's
    # netfilter/numiptent kernel-memory quota is exhausted (iptables "Memory allocation
    # problem" on container start), so bridge+NAT port publishing cannot be used for the
    # dialog's ~100 media ports. With host networking the dialog binds 4443 + its media
    # ports directly on the host (verified free). Dialog does not depend on docker DNS
    # (no RETICULUM_URL) — the Hubs client reaches it via reticulum's dialog_url.
    network_mode: host
    mem_limit: 256m
    cpu_shares: 1536
    deploy:
      resources:
        limits:
          memory: 256m
    environment:
      AUTH_KEY: /etc/perms.pub.pem
      HTTPS_CERT_FULLCHAIN: /code/certs/live/hubs.chemie-lernen.org/fullchain.pem
      HTTPS_CERT_PRIVKEY: /code/certs/live/hubs.chemie-lernen.org/privkey.pem
      INTERACTIVE: "false"
      MEDIASOUP_MIN_PORT: 40000
      # Widened 40050 -> 40150: more concurrent RTP ports (3x aggregate buffering
      # headroom). dialog is host-networked, so this costs ZERO numiptent and only
      # conntrack entries (171/4M available).
      MEDIASOUP_MAX_PORT: 40150
      MEDIASOUP_ANNOUNCED_IP: ${PRIVATE_NETWORK_IP}
    volumes:
      - hubs-compose_dialog:/code
      - letsencrypt:/code/certs
    working_dir: /code

networks:
  hubs-net:
    driver: bridge
  traefik-public:
    external: true

# Reuse the data volumes created by the prior hubs-compose deployment.
volumes:
  pgdata:
    external: true
    name: hubs-compose_pgdata
  retstorage:
    external: true
    name: hubs-compose_retstorage
  letsencrypt:
    external: true
    name: hubs-compose_letsencrypt
  hubs-compose_hubs:
    external: true
    name: hubs-compose_hubs
  hubs-compose_spoke:
    external: true
    name: hubs-compose_spoke
  hubs-compose_dialog:
    external: true
    name: hubs-compose_dialog
