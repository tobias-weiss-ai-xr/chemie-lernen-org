global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'chat-api'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['chemie-chat-api:3001']
  - job_name: 'node'
    static_configs:
      - targets: ['node_exporter:9100']
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
  - job_name: 'neo4j'
    static_configs:
      - targets: ['neo4j-exporter:9399']

alerting:
  alertmanagers: []

rule_files:
  - '/etc/prometheus/alerts.yml'
