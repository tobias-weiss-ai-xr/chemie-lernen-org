# Chemie-Forschung — weekly KG-driven research articles.
#
# Calls the reusable workflow in tobias-weiss-ai-xr/chemierecherche-runner,
# which runs on this repo's ci-host runner (KG + LLM reachable) and commits
# generated articles directly into myhugoapp/content/chemie-forschung/.

name: Chemie-Forschung weekly

on:
  schedule:
    # Tuesday 06:30 UTC (after the graphwiz.ai general batch on Monday)
    - cron: '30 6 * * 2'
  workflow_dispatch:
    inputs:
      article_count:
        description: 'Anzahl Artikel (default: 3)'
        required: false
        default: '3'
      topic:
        description: 'Fester Topic (optional, z.B. redoxreaktion)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate:
    uses: tobias-weiss-ai-xr/chemierecherche-runner/.github/workflows/generate.yml@main
    with:
      article_count: ${{ github.event.inputs.article_count || '3' }}
      topic: ${{ github.event.inputs.topic }}
      neo4j_host: ${{ vars.NEO4J_HOST }}
      neo4j_user: ${{ vars.NEO4J_USER }}
      neo4j_database: ${{ vars.NEO4J_DATABASE }}
      llm_base_url: ${{ vars.LLM_BASE_URL }}
      llm_model: ${{ vars.LLM_MODEL }}
    secrets:
      neo4j_password: ${{ secrets.NEO4J_PASSWORD }}
      llm_api_key: ${{ secrets.LLM_API_KEY }}
