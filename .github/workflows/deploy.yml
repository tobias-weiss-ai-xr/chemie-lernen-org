# ============================================================
# Deploy workflow - chemie-lernen.org
# Builds Docker images, pushes to private registry, deploys
# ============================================================
name: Deploy chemie-lernen.org

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: registry.chemie-lernen.org

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run unit tests
        run: npm test

  build-and-deploy:
    needs: test
    runs-on: [self-hosted, legion]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to private registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Generate image tags
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "hugo_tags=${{ env.REGISTRY }}/chemie-lernen-org:latest,${{ env.REGISTRY }}/chemie-lernen-org:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "chat_tags=${{ env.REGISTRY }}/chemie-chat-api:latest,${{ env.REGISTRY }}/chemie-chat-api:${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push Hugo image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.hugo_tags }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/chemie-lernen-org:latest
          cache-to: type=inline

      - name: Build and push Chat-API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.chat_tags }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/chemie-chat-api:latest
          cache-to: type=inline

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e
            echo "=== Pulling latest compose config from git ==="
            cd /opt/git/hugo-chemie-lernen-org
            git pull --quiet
            echo "=== Pulling new images from registry ==="
            docker pull ${{ env.REGISTRY }}/chemie-lernen-org:latest
            docker pull ${{ env.REGISTRY }}/chemie-chat-api:latest
            echo "=== Recreating containers ==="
            docker compose up -d hugo-chemie-lernen-org
            docker compose up -d chemie-chat-api
            echo "=== Cleaning up old images ==="
            docker image prune -f
            echo "=== Deploy complete ==="
