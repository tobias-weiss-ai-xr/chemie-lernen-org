# ============================================================
# Deploy workflow - chemie-lernen.org
# Builds Docker images, pushes to private registry, deploys
# ============================================================
name: Deploy chemie-lernen.org

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  HUGO_IMAGE: ghcr.io/${{ github.repository_owner }}/chemie-hugo
  CHAT_IMAGE: ghcr.io/${{ github.repository_owner }}/chemie-chat-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Vendor proprietary core (private chemie-core repo)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CORE_DEPLOY_KEY }}" > ~/.ssh/chemie_core_deploy
          chmod 600 ~/.ssh/chemie_core_deploy
          scripts/vendor-core.sh

      - name: Setup Node.js
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install API dependencies (api/ has its own package.json)
        run: npm ci --prefix api

      - name: Run bun audit (critical only)
        run: bun audit --audit-level=critical || echo '[CI] bun audit found critical/high issues (non-fatal)'

      - name: Run linter
        run: bun run lint

      - name: Run unit tests
        run: npm test

  build-and-deploy:
    needs: test
    runs-on: [self-hosted, legion]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Vendor proprietary core (private chemie-core repo)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CORE_DEPLOY_KEY }}" > ~/.ssh/chemie_core_deploy
          chmod 600 ~/.ssh/chemie_core_deploy
          scripts/vendor-core.sh

      - name: Export KG data from Neo4j
        run: NODE_PATH=api/node_modules node scripts/export-kg-data.mjs || echo '[CI] Neo4j export skipped (non-fatal)'

      - name: Validate curriculum data quality
        run: node scripts/validate-curricula.mjs

      - name: Generate entity pages from KG data
        run: node scripts/generate-entity-pages.mjs

      - name: Fetch Zig's Chemistry 42 videos (auto-update /lernvideos/)
        run: node scripts/fetch-zigs-videos.mjs || echo '[CI] Zig video feed fetch skipped (non-fatal)'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "hugo_tags=${{ env.HUGO_IMAGE }}:latest,${{ env.HUGO_IMAGE }}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "chat_tags=${{ env.CHAT_IMAGE }}:latest,${{ env.CHAT_IMAGE }}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push Hugo image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.hugo_tags }}
          cache-from: type=registry,ref=${{ env.HUGO_IMAGE }}:latest

      - name: Build and push Chat-API image
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.chat_tags }}
          cache-from: type=registry,ref=${{ env.CHAT_IMAGE }}:latest

      - name: Make ghcr images public (server pulls without registry creds)
        run: |
          for pkg in chemie-hugo chemie-chat-api; do
            curl -sS -X PATCH \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/user/packages/container/$pkg/visibility" \
              -d '{"visibility":"public"}' || echo "warn: could not set $pkg public"
          done

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e
            echo "=== Pulling latest compose config from git ==="
            cd /opt/git/hugo-chemie-lernen-org
            # Docker rw mounts can leave root-owned files in the checkout that
            # break 'git reset --hard' (Permission denied) -> normalize ownership.
            sudo chown -R "$(id -u):$(id -g)" .
            # Back up .env so a botched stash/pop can never take the API down.
            cp -f .env /tmp/chemie.env.bak 2>/dev/null || true
            # Robust sync: fetch + hard reset never produces merge conflicts
            # (stash/pull/pop left the tree in a conflicted state and blocked
            # deploys for a week). Stash first so local-only files survive.
            git fetch origin
            git stash push -q --include-untracked -m "deploy-sync" 2>/dev/null || true
            git reset --hard origin/main
            git stash pop -q 2>/dev/null || true
            test -f .env || cp -f /tmp/chemie.env.bak .env 2>/dev/null || true
            echo "=== Pulling new images from GitHub Container Registry ==="
            docker pull ghcr.io/${{ github.repository_owner }}/chemie-hugo:latest
            docker pull ghcr.io/${{ github.repository_owner }}/chemie-chat-api:latest
            echo "=== Removing stale web containers (avoid name conflict on recreate) ==="
            docker rm -f hugo-chemie-lernen-org chemie-chat-api 2>/dev/null || true
            echo "=== Recreating containers ==="
            docker compose up -d hugo-chemie-lernen-org
            docker compose up -d chemie-chat-api
            echo "=== Running smoke tests ==="
            sleep 20
            SITE="https://chemie-lernen.org"
            API="$SITE"
            # 1. Entity page returns 200
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$SITE/entity/")
            if [ "$HTTP_CODE" != "200" ]; then echo "❌ SMOKE FAIL: /entity/ returned $HTTP_CODE"; exit 1; fi
            echo "  ✓ /entity/ HTTP 200"
            # 2. Script tag has properly quoted src attribute
            FOUND=$(curl -s "$SITE/entity/" | grep -c "/js/entity-index.js" || true)
            if [ "$FOUND" -eq 0 ]; then echo "❌ SMOKE FAIL: entity-index.js not found in page"; exit 1; fi
            echo "  ✓ entity-index.js found in page"
            # 3. entity-index.js loads (HTTP 200)
            JS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$SITE/js/entity-index.js")
            if [ "$JS_CODE" != "200" ]; then echo "❌ SMOKE FAIL: /js/entity-index.js returned $JS_CODE"; exit 1; fi
            echo "  ✓ entity-index.js HTTP 200"
            # 4. /api/health returns 200
            HEALTH_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$API/api/health")
            if [ "$HEALTH_CODE" != "200" ]; then echo "❌ SMOKE FAIL: /api/health returned $HEALTH_CODE"; exit 1; fi
            echo "  ✓ /api/health HTTP 200"
            # 5. /api/health payload includes status=ok
            HEALTH_BODY=$(curl -s "$API/api/health")
            if ! echo "$HEALTH_BODY" | grep -q '"status":"ok"'; then
              echo "❌ SMOKE FAIL: /api/health missing status=ok (body: $HEALTH_BODY)"; exit 1
            fi
            echo "  ✓ /api/health status=ok"
            # 5b. Email delivery status (password-reset mails) — WARN, do not block deploy
            EMAIL_STATE=$(echo "$HEALTH_BODY" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("email",{}).get("state","missing"))' 2>/dev/null || echo missing)
            if [ "$EMAIL_STATE" = "ready" ]; then
              echo "  ✓ email: ready"
            elif [ "$EMAIL_STATE" = "placeholder" ]; then
              echo "  ⚠️ SMOKE WARN: SMTP_PASSWORD in .env is a placeholder — password-reset emails will NOT send. Set the real mailbox password (1blu panel) and redeploy."
            else
              echo "  ⚠️ SMOKE WARN: email state=$EMAIL_STATE — password-reset emails may not send (see /api/health email.lastError)"
            fi
            # 6. /api/kg-stats returns valid JSON (skip if Neo4j is down)
            NEO4J_UP=$(echo "$HEALTH_BODY" | grep -o '"neo4j":"[^"]*"' | grep -v 'unavailable' || true)
            if [ -n "$NEO4J_UP" ]; then
              STATS_BODY=$(curl -sf "$API/api/kg-stats" -m 30)
              if [ -z "$STATS_BODY" ]; then echo "❌ SMOKE FAIL: /api/kg-stats empty body"; exit 1; fi
              if ! echo "$STATS_BODY" | python3 -c 'import sys, json; json.loads(sys.stdin.read())' 2>/dev/null; then
                echo "❌ SMOKE FAIL: /api/kg-stats not valid JSON"; exit 1
              fi
              echo "  ✓ /api/kg-stats returns valid JSON"
            else
              echo "  ⚠ /api/kg-stats skipped (Neo4j unavailable — non-fatal)"
            fi
            # 7. /api/chat rejects empty body with 400 (NOT 500)
            CHAT_CODE=$(curl -s -X POST "$API/api/chat" \
              -H "Content-Type: application/json" \
              -d '{}' \
              -o /dev/null -w "%{http_code}" -m 30)
            if [ "$CHAT_CODE" != "400" ]; then
              echo "❌ SMOKE FAIL: /api/chat expected 400 on empty body, got $CHAT_CODE"; exit 1
            fi
            echo "  ✓ /api/chat validates input (400 on empty body)"
            # 8. Legacy umlaut URL redirects to its canonical entity page
            LEGACY_CODE=$(curl -s -o /dev/null -w "%{http_code}" -L "$SITE/entity/essigs%C3%A4ure/")
            if [ "$LEGACY_CODE" != "200" ]; then echo "❌ SMOKE FAIL: legacy /entity/essigsäure/ returned $LEGACY_CODE"; exit 1; fi
            echo "  ✓ legacy umlaut entity URL redirects (200)"
            echo "=== Smoke tests passed ==="
            echo "=== Pinging healthchecks.io ==="
            curl -fsS -m 10 "${{ secrets.HEALTHCHECKS_IO_URL || 'https://hc-ping.com/chemi-deploy-ok' }}" \
              --data-raw "status=ok smoke-tests-passed $(date)" || echo "healthchecks.io ping skipped (non-fatal)"
            echo "=== Cleaning up old images ==="
            docker image prune -f
            echo "=== Deploy complete ==="
            # Hubs (reticulum/hubs-client/...) now runs on this host via
            # docker-compose.hubs.yml (TLS terminated by the host Traefik).
            # Stop the old /opt/containers/hubs-compose stack first to free ports/names.
            echo "=== Stopping legacy hubs-compose stack ==="
            sudo docker compose -f /opt/containers/hubs-compose/docker-compose.yml down --remove-orphans 2>/dev/null || true
            export PRIVATE_NETWORK_IP=192.168.1.1
            echo "=== Bringing up hubs stack (docker-compose.hubs.yml) ==="
            sudo PRIVATE_NETWORK_IP=192.168.1.1 docker compose -f docker-compose.hubs.yml up -d 2>&1 | tail -30 || echo "warn: hubs up failed (non-fatal)"
            echo "--- installing node deps in hubs services (source volumes lack node_modules) ---"
            for spec in "hubs-client:/code" "hubs-admin:/code/admin" "spoke:/code" "hubs-dialog:/code"; do
              svc="${spec%%:*}"; dir="${spec##*:}"
              echo "  -> $svc (cd $dir && yarn install --ignore-engines)"
              sudo docker compose -f docker-compose.hubs.yml run --rm "$svc" sh -c "cd $dir && yarn install --ignore-engines 2>&1 | tail -5 || npm install --ignore-engines 2>&1 | tail -5" 2>&1 | tail -12 || true
            done
            # Build the production hubs-client bundle (dist/) that the static
            # server (python3 /code/static-server.py) serves. Running the
            # webpack-dev-server in prod caused the manifest 404, HMR /ws
            # console noise and dev-server core dumps.
            # Make the hubs-client serve a static production build (no dev server):
            # copy the static server + apply the manifest/webpack setup idempotently.
            echo '--- hubs-client: static server + manifest + webpack patch ---'
            sudo docker cp scripts/hubs-static-server.py hubs-client:/code/static-server.py
            sudo docker cp scripts/setup-hubs-client.mjs hubs-client:/code/setup-hubs-client.mjs
            sudo docker compose -f docker-compose.hubs.yml run --rm hubs-client node /code/setup-hubs-client.mjs 2>&1 | tail -5 || echo 'warn: hubs-client setup failed (non-fatal)'
            echo '--- building production hubs-client dist ---'
            sudo docker compose -f docker-compose.hubs.yml run --rm hubs-client sh -c "node_modules/.bin/webpack --mode=production" 2>&1 | tail -8 || echo 'warn: hubs-client build failed (non-fatal)'
            sudo docker compose -f docker-compose.hubs.yml restart hubs-client hubs-admin spoke hubs-dialog 2>&1 | tail -5 || true
            echo "--- starting hubs node services one at a time (avoid OOM spike) ---"
            for svc in hubs-client hubs-admin spoke hubs-dialog; do
              echo "  starting $svc"
              sudo docker compose -f docker-compose.hubs.yml up -d "$svc" 2>&1 | tail -3 || true
              sleep 15
            done
            echo "--- docker volumes (hubs-related) ---"
            sudo docker volume ls 2>/dev/null | grep -i hubs || echo "(no hubs volumes)"
            echo "--- all docker volumes ---"
            sudo docker volume ls 2>/dev/null | head -40
            echo "--- waiting 180s for hubs apps to boot ---"
            sleep 180
            echo "--- hubs stack status ---"
            sudo docker compose -f docker-compose.hubs.yml ps 2>&1 | head -30 || true
            echo "--- server-side direct probes (bypass Traefik) ---"
            echo "reticulum:4001 /api/v1/meta = $(sudo docker exec hubs-reticulum curl -sk -m 10 -o /dev/null -w '%{http_code}' http://localhost:4001/api/v1/meta 2>/dev/null || echo n/a)"
            echo "hubs-client:8080 /            = $(sudo docker exec hubs-client curl -sk -m 10 -o /dev/null -w '%{http_code}' http://localhost:8080 2>/dev/null || echo n/a)"
            echo "--- check /code/public in hubs-client volume ---"
            sudo docker compose -f docker-compose.hubs.yml run --rm hubs-client sh -c "ls -la /code/public/ 2>&1 | head -8" 2>&1 | tail -3 || true
            echo "--- probe hubs.chemie-lernen.org (via Traefik) ---"
            echo "root:  $(curl -sk -m 20 -o /dev/null -w '%{http_code}' https://hubs.chemie-lernen.org/)"
            echo "meta:  $(curl -sk -m 20 -o /dev/null -w '%{http_code}' https://hubs.chemie-lernen.org/api/v1/meta)"
            echo "rooms: $(curl -sk -m 20 -o /dev/null -w '%{http_code}' https://hubs.chemie-lernen.org/api/v1/rooms)"
            for svc in hubs-reticulum hubs-client hubs-dialog; do
              echo "===== logs: $svc ====="
              sudo docker compose -f docker-compose.hubs.yml logs --tail=20 "$svc" 2>&1 | tail -20 || true
            done
