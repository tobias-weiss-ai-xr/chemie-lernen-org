# ============================================================
# Deploy workflow — chemie-lernen.org
# Builds Docker image, pushes to private registry, deploys
# ============================================================
name: Deploy chemie-lernen.org

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: registry.chemie-lernen.org
  IMAGE_NAME: chemie-lernen-org

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to private registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Generate image tags
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Digest will be based on SHA ${SHORT_SHA}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e
            echo "=== Pulling latest compose config from git ==="
            cd /opt/git/hugo-chemie-lernen-org
            git pull --quiet
            echo "=== Pulling new image from registry ==="
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            echo "=== Recreating container ==="
            docker compose up -d hugo-chemie-lernen-org
            echo "=== Cleaning up old images ==="
            docker image prune -f
            echo "=== Deploy complete ==="
