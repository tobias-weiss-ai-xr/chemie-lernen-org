name: curricula-didaktik

on:
  push:
    paths:
      - 'scripts/curricula_didaktik/**'
      - 'myhugoapp/data/curricula/**'
      - 'myhugoapp/data/didaktik/**'
      - 'myhugoapp/data/modulhandbuch/**'
      - '.github/workflows/curricula-didaktik.yml'
  pull_request:
  schedule:
    - cron: '0 3 * * 1'  # weekly Monday 03:00 UTC

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: scripts/curricula_didaktik
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/curricula_didaktik/requirements.txt
      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install --break-system-packages -r requirements.txt
      - name: Install test deps
        run: pip install --break-system-packages -r requirements-dev.txt
      - name: Run tests
        run: pytest tests/ -v
      - name: Verify output shape (no re-scrape)
        run: make verify

  scrape:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        working-directory: scripts/curricula_didaktik
        run: |
          pip install --break-system-packages -r requirements.txt
      - name: Run all scrapers
        working-directory: scripts/curricula_didaktik
        run: make all
      - name: Commit output
        run: |
          git config user.email "ci@chemie-lernen.org"
          git config user.name "Curricula CI"
          git add myhugoapp/data/curricula/ myhugoapp/data/didaktik/ myhugoapp/data/modulhandbuch/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "ci: scrape curricula + didaktik + modulhandbuch"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/tobias-weiss-ai-xr/chemie-lernen-org.git" HEAD:main
