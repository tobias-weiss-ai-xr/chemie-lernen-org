# ============================================================
# Hubs deploy - hubs.chemie-lernen.org
# The Hubs (Mozilla Hubs) stack lives at /opt/containers/hubs-compose
# on the server and is started manually (scripts/hubs-up.sh). This
# workflow restarts it via SSH so a downed backend (502 Bad Gateway
# from Traefik) can be recovered without manual server access.
# ============================================================
name: Deploy Hubs (hubs.chemie-lernen.org)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'restart (fast, reuse images) or rebuild (force image build)'
        required: false
        default: 'restart'

jobs:
  hubs-deploy:
    runs-on: [self-hosted, legion]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Restart Hubs stack via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e
            HUBS_DIR="${HUBS_DIR:-/opt/containers/hubs-compose}"
            cd "$HUBS_DIR"
            echo "=== Hubs stack status BEFORE ==="
            docker compose ps || true
            if [ "${{ github.event.inputs.mode }}" = "rebuild" ]; then
              echo "=== Rebuilding Hubs images (this can take 5-15 min) ==="
              docker compose up -d --build
            else
              echo "=== Bringing Hubs stack up (restart, reuse images) ==="
              docker compose up -d
            fi
            echo "=== Hubs stack status AFTER ==="
            sleep 20
            docker compose ps
            echo "=== Local health probe (haproxy / hubs-client) ==="
            curl -sk -o /dev/null -w "hubs-local: HTTP %{http_code}\n" https://127.0.0.1/ || true
