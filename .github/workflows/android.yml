# ============================================================
# Android CI - builds the native Kotlin/Compose app
# Verified on every push/PR to main: copiles, unit tests, APK
# ============================================================
name: Android build

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chemie-lernen-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release APK (signed with keystore CI secret)
    needs: build-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      CHEMIE_RELEASE_STORE_PASSWORD: ${{ secrets.CHEMIE_RELEASE_STORE_PASSWORD }}
      CHEMIE_RELEASE_KEY_ALIAS: ${{ secrets.CHEMIE_RELEASE_KEY_ALIAS }}
      CHEMIE_RELEASE_KEY_PASSWORD: ${{ secrets.CHEMIE_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore from secrets
        run: |
          if [ -n "${{ secrets.CHEMIE_RELEASE_KEYSTORE_B64 }}" ]; then
            mkdir -p "$HOME/.android"
            echo "${{ secrets.CHEMIE_RELEASE_KEYSTORE_B64 }}" | base64 -d > "$HOME/.android/chemie-release.jks"
            chmod 600 "$HOME/.android/chemie-release.jks"
            echo "CHEMIE_RELEASE_STORE_FILE=$HOME/.android/chemie-release.jks" >> "$GITHUB_ENV"
            echo "SIGNING=1" >> "$GITHUB_ENV"
          else
            echo "::warning::No CHEMIE_RELEASE_KEYSTORE_B64 secret — release APK will be UNSIGNED"
          fi

      - name: Build release APK (prod API base URL)
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify signature (when signed)
        if: env.SIGNING == '1'
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER" || APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chemie-lernen-release-apk
          path: android/app/build/outputs/apk/release/app-release*.apk
          if-no-files-found: error
          retention-days: 14