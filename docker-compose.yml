services:
  chemie-neo4j:
    image: neo4j:5.26-community
    container_name: chemie-neo4j
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      - NEO4J_AUTH=neo4j/chemie_knowledge_2024
      - NEO4J_dbms_default__database=chemie
      - NEO4J_dbms_security_auth__minimum__password__length=4
      - NEO4J_dbms_memory_heap_initial__size=256m
      - NEO4J_dbms_memory_heap_max__size=512m
    volumes:
      - chemie_neo4j_data:/data
      - chemie_neo4j_logs:/logs
    ports:
      - "0.0.0.0:7687:7687"
    networks:
      - traefik-web
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p chemie_knowledge_2024 \"RETURN 1\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  chemie-chat-api:
    image: registry.chemie-lernen.org/chemie-chat-api:latest
    container_name: chemie-chat-api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    environment:
      - LITELLM_URL=http://litellm-proxy:4000
      - LITELLM_MODEL=gemma-4
      - PORT=3001
    networks:
      - traefik-public
      - litellm-internal
      - traefik-web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.chat.rule=Host(`chemie-lernen.org`) && (PathPrefix(`/api/chat`) || PathPrefix(`/api/health`) || PathPrefix(`/api/kg-data`) || PathPrefix(`/api/kg-stats`) || PathPrefix(`/api/curriculum`) || PathPrefix(`/api/didaktik`) || PathPrefix(`/api/modulhandbuch`) || PathPrefix(`/api/entity`) || PathPrefix(`/api/article`) || PathPrefix(`/api/session`) || PathPrefix(`/api/admin`))"
      - "traefik.http.routers.chat.priority=100"
      - "traefik.http.routers.chat.entrypoints=websecure"
      - "traefik.http.routers.chat.tls=true"
      - "traefik.http.routers.chat.tls.certresolver=tls_resolver"
      - "traefik.http.services.chat.loadbalancer.server.port=3001"

  hugo-chemie-lernen-org:
    image: registry.chemie-lernen.org/chemie-lernen-org:latest
    container_name: hugo-chemie-lernen-org
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.chemie.rule=Host(`chemie-lernen.org`)"
      - "traefik.http.routers.chemie.entrypoints=websecure"
      - "traefik.http.routers.chemie.tls=true"
      - "traefik.http.routers.chemie.tls.certresolver=tls_resolver"
      - "traefik.http.services.chemie.loadbalancer.server.port=80"
      - "traefik.http.services.chemie.loadbalancer.server.url=http://172.22.0.10:80"
networks:
  traefik-web:
    driver: bridge
  traefik-public:
    external: true
  litellm-internal:
    external: true
    name: litellm-compose_litellm-internal

volumes:
  chemie_neo4j_data:
  chemie_neo4j_logs:
