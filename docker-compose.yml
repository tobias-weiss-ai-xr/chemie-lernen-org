services:
  chemie-neo4j:
    image: neo4j:5.26-community
    container_name: chemie-neo4j
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      - NEO4J_AUTH=neo4j/chemie
      - NEO4J_dbms_default__database=chemie
      - NEO4J_dbms_security_auth__minimum__password__length=4
      - NEO4J_dbms_memory_heap_initial__size=256m
      - NEO4J_dbms_memory_heap_max__size=512m
    volumes:
      - chemie_neo4j_data:/data
      - chemie_neo4j_logs:/logs
    ports:
      - "0.0.0.0:7687:7687"
    networks:
      - traefik-web
    healthcheck:
      test: ['CMD-SHELL', 'cypher-shell -u neo4j -p chemie "RETURN 1" || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  chemie-chat-api:
    image: node:20-alpine
    container_name: chemie-chat-api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    working_dir: /app
    volumes:
      - ./api:/app
    environment:
      - LITELLM_URL=http://litellm-proxy:4000
      - LITELLM_MODEL=gemma-4
      - PORT=3001
    command: sh -c "npm install --omit=dev && node server.js"
    networks:
      - traefik-public
      - litellm-internal
      - traefik-web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chat.rule=Host(`chemie-lernen.org`) && PathPrefix(`/api/chat`) || Host(`chemie-lernen.org`) && PathPrefix(`/api/health`) || Host(`chemie-lernen.org`) && Path(`/api/kg-data`)"
      - "traefik.http.routers.chat.priority=100"
      - "traefik.http.services.chat.loadbalancer.server.port=3001"

  hugo-chemie-lernen-org:
    image: nginx:alpine
    container_name: hugo-chemie-lernen-org
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - traefik-web
      - traefik-public
    volumes:
      - ./myhugoapp/public:/usr/share/nginx/html:ro
      - ./myhugoapp/static/api-proxy.conf:/etc/nginx/conf.d/api-proxy.conf
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hugo.rule=Host(`chemie-lernen.org`,`www.chemie-lernen.org`)"
      - "traefik.http.routers.hugo.entrypoints=web"
      - "traefik.http.routers.hugo.priority=60"
      - "traefik.http.routers.hugo.middlewares=https-redirect@file"
      - "traefik.http.routers.hugo-secure.rule=Host(`chemie-lernen.org`,`www.chemie-lernen.org`)"
      - "traefik.http.routers.hugo-secure.entrypoints=websecure"
      - "traefik.http.routers.hugo-secure.priority=60"
      - "traefik.http.routers.hugo-secure.tls=true"
      - "traefik.http.routers.hugo-secure.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.hugo-secure.middlewares=security-headers@file,compression@file"
      - "traefik.http.services.hugo.loadbalancer.server.port=80"

networks:
  traefik-web:
    driver: bridge
  traefik-public:
    external: true
  litellm-internal:
    external: true
    name: litellm-compose_litellm-internal

volumes:
  chemie_neo4j_data:
  chemie_neo4j_logs:
