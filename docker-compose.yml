services:
  # ── Central Knowledge Graph (shared) ────────────────────────────────
  # Contains ALL subsets: chemie, code-analysis, modulhandbuch, etc.
  # The ~683k code-analysis nodes live here. DO NOT DETACH DELETE.
  chemie-neo4j:
    image: neo4j:5.26-community
    container_name: chemie-neo4j
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_dbms_default__database=chemie
      - NEO4J_dbms_security_auth__minimum__password__length=4
      - NEO4J_dbms_memory_heap_initial__size=256m
      - NEO4J_dbms_memory_heap_max__size=512m
    volumes:
      - chemie_neo4j_data:/data
      - chemie_neo4j_logs:/logs
    ports:
      - "127.0.0.1:7687:7687"  # localhost-only: API/scripts use docker network; keep Bolt off the public internet
    networks:
      - traefik-web
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD} \"RETURN 1\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Chemistry-only Knowledge Graph ─────────────────────────────────
  # Dedicated Neo4j instance containing ONLY the chemie subset:
  # Entity, Document, Tag, Content labels. No code-analysis pollution.
  # Populated by scripts/migrate-chemie-neo4j.mjs (one-time migration
  # from chemie-neo4j) and maintained by import-*.mjs scripts going forward.
  chemie-kg:
    image: neo4j:5.26-community
    container_name: chemie-kg
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_dbms_default__database=chemie
      - NEO4J_dbms_security_auth__minimum__password__length=4
      - NEO4J_dbms_memory_heap_initial__size=256m
      - NEO4J_dbms_memory_heap_max__size=512m
    ports:
      - "127.0.0.1:7688:7687"  # localhost-only: scripts use docker network names; keep Bolt off the public internet
    volumes:
      - chemie_kg_data:/data
      - chemie_kg_logs:/logs
    networks:
      - traefik-web
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD} \"RETURN 1\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  chemie-chat-api:
    image: registry.chemie-lernen.org/chemie-chat-api:latest
    container_name: chemie-chat-api
    restart: unless-stopped
    volumes:
      - ./myhugoapp/data/learning-paths.json:/app/data/learning-paths.json:ro
      # users.json must survive container recreates (every deploy) — the
      # image contains only a seed copy, and the container filesystem is
      # ephemeral. Bind-mount the host file (untracked, uid 1000 matches the
      # node container user) so registrations persist across deploys.
      - ./api/data/users.json:/app/data/users.json
    mem_limit: 256M
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health | grep -q '\"status\":\"ok\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      - LITELLM_URL=http://litellm-proxy:4000
      - LITELLM_MODEL=tud/gemma-4-31b-it
      - LITELLM_API_KEY=${LITELLM_API_KEY}
      - PORT=3001
      - NEO4J_URI=bolt://chemie-kg:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - NEO4J_DATABASE=chemie
      - JWT_SECRET=${JWT_SECRET}
      # SMTP — password-reset emails (mail.tobias-weiss.org):
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
      # Stripe keys — set these for premium checkout to work:
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PRICE_ID=${STRIPE_PRICE_ID}
      # Monitoring — set these for error tracking and uptime monitoring:
      - SENTRY_DSN=${SENTRY_DSN}
      - HEALTHCHECKS_IO_URL=${HEALTHCHECKS_IO_URL}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
    networks:
      - traefik-public
      - litellm-internal
      - traefik-web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.chat.rule=(Host(`chemie-lernen.org`) || Host(`www.chemie-lernen.org`)) && (PathPrefix(`/api/chat`) || PathPrefix(`/api/health`) || PathPrefix(`/api/kg-data`) || PathPrefix(`/api/kg-stats`) || PathPrefix(`/api/curriculum`) || PathPrefix(`/api/curricula`) || PathPrefix(`/api/content`) || PathPrefix(`/api/didaktik`) || PathPrefix(`/api/modulhandbuch`) || PathPrefix(`/api/entity`) || PathPrefix(`/api/article`) || PathPrefix(`/api/session`) || PathPrefix(`/api/admin`) || PathPrefix(`/api/auth`) || PathPrefix(`/api/quizzes`) || PathPrefix(`/api/quiz-results`) || PathPrefix(`/api/studienvergleich`))"
      - "traefik.http.routers.chat.priority=100"
      - "traefik.http.routers.chat.entrypoints=websecure"
      - "traefik.http.routers.chat.tls=true"
      - "traefik.http.routers.chat.tls.certresolver=mytlschallenge"
      - "traefik.http.services.chat.loadbalancer.server.port=3001"

  hugo-chemie-lernen-org:
    volumes:
      - ./myhugoapp/static/openspec:/usr/share/nginx/html/openspec
      - ./myhugoapp/static/landscape:/usr/share/nginx/html/landscape
      - ./myhugoapp/static/api-proxy.conf:/etc/nginx/conf.d/api-proxy.conf
    image: registry.chemie-lernen.org/chemie-lernen-org:latest
    container_name: hugo-chemie-lernen-org
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.chemie.rule=Host(`chemie-lernen.org`) || Host(`www.chemie-lernen.org`)"
      - "traefik.http.routers.chemie.entrypoints=websecure"
      - "traefik.http.routers.chemie.tls=true"
      - "traefik.http.routers.chemie.tls.certresolver=mytlschallenge"
      - "traefik.http.services.chemie.loadbalancer.server.port=80"

  # ── Observability Stack ─────────────────────────────────────────
  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    network_mode: host
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"  # localhost-only: prometheus scrapes via docker network (cadvisor:8080)
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    command:
      - '--storage.tsdb.retention.time=30d'
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - traefik-web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.chemie-lernen.org`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls=true"
      - "traefik.http.routers.prometheus.tls.certresolver=mytlschallenge"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

networks:
  traefik-web:
    driver: bridge
  traefik-public:
    external: true
  litellm-internal:
    external: true
    name: litellm-compose_litellm-internal

volumes:
  chemie_neo4j_data:
  chemie_neo4j_logs:
  chemie_kg_data:
  chemie_kg_logs:
  prometheus_data:
