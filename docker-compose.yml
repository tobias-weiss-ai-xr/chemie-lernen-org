services:
  hugo-chemie-lernen-org:
    image: nginx:alpine
    container_name: hugo-chemie-lernen-org
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - traefik-web
      - traefik-public
    volumes:
      - ./myhugoapp/public:/usr/share/nginx/html:ro
    labels:
      - "traefik.enable=true"

networks:
  traefik-web:
    driver: bridge
  traefik-public:
    external: true
