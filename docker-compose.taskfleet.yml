# docker-compose.taskfleet.yml
# ===========================
# TaskFleet Parallel Execution Configuration
#
# This file extends docker-compose.yml to add parallel task execution
# capabilities using Docker services.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.taskfleet.yml up
#   
#   # Run specific task group
#   docker compose -f docker-compose.yml -f docker-compose.taskfleet.yml run --rm taskfleet-worker-1
#
# Each worker can execute tasks in parallel. The main taskfleet service
# coordinates the work using Redis for task queue management.

version: '3.8'

services:
  # Redis for task queue coordination
  taskfleet-redis:
    image: redis:7-alpine
    container_name: chemie-taskfleet-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - traefik-web
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=false"

  # TaskFleet coordinator
  taskfleet-coordinator:
    image: node:22-alpine
    container_name: chemie-taskfleet-coordinator
    restart: unless-stopped
    working_dir: /workspace
    volumes:
      - .:/workspace
      - /workspace/node_modules
    environment:
      - NODE_ENV=production
      - NEO4J_URI=bolt://chemie-neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-chemie_knowledge_2024}
      - NEO4J_DATABASE=chemie
      - REDIS_HOST=taskfleet-redis
      - REDIS_PORT=6379
      - CONCURRENCY=${CONCURRENCY:-8}
    networks:
      - traefik-web
    depends_on:
      taskfleet-redis:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Starting TaskFleet Coordinator...' &&
        echo 'Redis: $$REDIS_HOST:$${REDIS_PORT}' &&
        echo 'Concurrency: $$CONCURRENCY' &&
        node scripts/taskfleet-coordinator.mjs
      "
    labels:
      - "traefik.enable=false"

  # TaskFleet workers (scalable)
  taskfleet-worker:
    image: node:22-alpine
    container_name: chemie-taskfleet-worker-1
    restart: unless-stopped
    working_dir: /workspace
    volumes:
      - .:/workspace
      - /workspace/node_modules
    environment:
      - NODE_ENV=production
      - NEO4J_URI=bolt://chemie-neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-chemie_knowledge_2024}
      - NEO4J_DATABASE=chemie
      - REDIS_HOST=taskfleet-redis
      - REDIS_PORT=6379
      - WORKER_ID=1
      - WORKER_NAME=worker-1
    networks:
      - traefik-web
    depends_on:
      taskfleet-redis:
        condition: service_healthy
      chemie-neo4j:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Starting TaskFleet Worker $$WORKER_ID...' &&
        node scripts/taskfleet-worker.mjs
      "
    labels:
      - "traefik.enable=false"
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Additional workers can be started with:
  # docker compose -f docker-compose.yml -f docker-compose.taskfleet.yml up -d --scale taskfleet-worker=4

  taskfleet-worker-2:
    extends: taskfleet-worker
    container_name: chemie-taskfleet-worker-2
    environment:
      - WORKER_ID=2
      - WORKER_NAME=worker-2

  taskfleet-worker-3:
    extends: taskfleet-worker
    container_name: chemie-taskfleet-worker-3
    environment:
      - WORKER_ID=3
      - WORKER_NAME=worker-3

  taskfleet-worker-4:
    extends: taskfleet-worker
    container_name: chemie-taskfleet-worker-4
    environment:
      - WORKER_ID=4
      - WORKER_NAME=worker-4

  taskfleet-worker-5:
    extends: taskfleet-worker
    container_name: chemie-taskfleet-worker-5
    environment:
      - WORKER_ID=5
      - WORKER_NAME=worker-5

  taskfleet-worker-6:
    extends: taskfleet-worker
    container_name: chemie-taskfleet-worker-6
    environment:
      - WORKER_ID=6
      - WORKER_NAME=worker-6

  taskfleet-worker-7:
    extends: taskfleet-worker
    container_name: chemie-taskfleet-worker-7
    environment:
      - WORKER_ID=7
      - WORKER_NAME=worker-7

  taskfleet-worker-8:
    extends: taskfleet-worker
    container_name: chemie-taskfleet-worker-8
    environment:
      - WORKER_ID=8
      - WORKER_NAME=worker-8

# Monitoring service for TaskFleet
  taskfleet-monitor:
    image: node:22-alpine
    container_name: chemie-taskfleet-monitor
    restart: unless-stopped
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      - NODE_ENV=production
      - REDIS_HOST=taskfleet-redis
      - REDIS_PORT=6379
    networks:
      - traefik-web
    depends_on:
      - taskfleet-redis
    command: >
      sh -c "
        echo 'Starting TaskFleet Monitor...' &&
        node scripts/taskfleet-monitor.mjs
      "
    labels:
      - "traefik.enable=false"
      - "traefik.http.routers.taskfleet-monitor.rule=Host(\'taskfleet.chemie-lernen.org\')"
      - "traefik.http.routers.taskfleet-monitor.entrypoints=websecure"
      - "traefik.http.routers.taskfleet-monitor.tls=true"
      - "traefik.http.routers.taskfleet-monitor.service=taskfleet-monitor"
      - "traefik.http.services.taskfleet-monitor.loadbalancer.server.port=3000"
    ports:
      - "3000:3000"

volumes:
  redis_data:
    driver: local
