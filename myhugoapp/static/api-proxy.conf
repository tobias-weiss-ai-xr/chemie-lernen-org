# chemie-lernen.org — nginx server config
# Serves Hugo static site, proxies API to chat service

server {
    listen 80;
    server_name _;

    # ========================================
    # Sicherheits-Header (Server-Level)
    # NOTE: nginx drops inherited add_header when a location block
    # defines its own add_header. We repeat these in each location.
    # ========================================
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline'" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ========================================
    # Statische Assets mit Hash/Cache-Busting
    # Fingerprinted Dateien: 1 Jahr Cache
    # ========================================
    location ~* \.(css|js)$ {
        root /usr/share/nginx/html;
        expires 365d;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline'" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        access_log off;
    }

    location /fonts/ {
        root /usr/share/nginx/html;
        expires 365d;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline'" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        access_log off;
    }

    location /pagefind/ {
        root /usr/share/nginx/html;
        expires 365d;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline'" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        access_log off;
    }

    # ========================================
    # Bilder: 30 Tage Cache (können aktualisiert werden)
    # ========================================
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline'" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        access_log off;
    }

    # ========================================
    # Webfonts: 1 Jahr Cache
    # ========================================
    location ~* \.(woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 365d;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline'" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        access_log off;
    }

    # ========================================
    # HTML + API: kein Cache (dynamisch)
    # ========================================
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline'" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # ========================================
    # API-Proxy zum Chat-Service
    # Variable-based upstream so nginx does not fail at startup
    # when the chat-api container is restarting/unreachable.
    # ========================================
    location /api/ {
        # Use a variable to defer DNS resolution to request time.
        # The Docker embedded DNS (127.0.0.11) is used as resolver.
        resolver 127.0.0.11 valid=30s;
        resolver_timeout 2s;
        set $chat_api_upstream http://chemie-chat-api:3001;
        proxy_pass $chat_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # On upstream failure (chat-api down), return 503 cleanly
        # so the rest of the site (and subdomains) keep working.
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        error_page 502 503 504 = @chat_api_down;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # Fallback for when chat-api is unreachable
    location @chat_api_down {
        default_type application/json;
        return 503 '{"error":"chat service temporarily unavailable","status":"degraded"}';
    }
}
