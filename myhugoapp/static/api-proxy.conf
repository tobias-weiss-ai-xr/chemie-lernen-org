# ========================================
# openDesk API Proxy Configuration
# Route /api/* requests to chemie-chat-api
# ========================================

# Docker DNS resolver for variable-based proxy_pass
# This prevents nginx startup failure when chat-api is in restart loop
resolver 127.0.0.11 valid=10s;

set $chat_api_upstream http://chemie-chat-api:3001;

# API proxy to chat service
location /api/ {
    proxy_pass $chat_api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;

    # Fallback to 503 if upstream unavailable
    proxy_intercept_errors on;
    error_page 502 503 504 =503 @api_fallback;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
}

# Fallback endpoint when API is unavailable
location @api_fallback {
    add_header Content-Type application/json;
    return 503 '{"status":"error","message":"Chat API temporarily unavailable"}';

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
}
