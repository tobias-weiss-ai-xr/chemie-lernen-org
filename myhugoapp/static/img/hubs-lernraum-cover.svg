<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="hubsCoverTitle hubsCoverDesc">
  <title id="hubsCoverTitle">Gemeinsamer 3D-Lernraum in Mozilla Hubs</title>
  <desc id="hubsCoverDesc">Artistische Darstellung: drei Avatare stehen um ein schwebendes Molekülmodell in einem virtuellen Raum mit Periodensystem-Wand, Sternen und UI-Elementen.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.5" stop-color="#123047"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.52" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#2dd4bf" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="atomC" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0d9488"/>
    </radialGradient>
    <radialGradient id="atomO" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#fda4af"/>
      <stop offset="1" stop-color="#e11d48"/>
    </radialGradient>
    <radialGradient id="atomN" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </radialGradient>
    <radialGradient id="atomH" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </radialGradient>
    <linearGradient id="bodyA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="bodyB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="bodyC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0.18"/>
    </linearGradient>
    <clipPath id="floorClip"><rect x="0" y="415" width="800" height="185"/></clipPath>
  </defs>

  <!-- Hintergrund -->
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>

  <!-- Sterne / Partikel -->
  <g fill="#e2e8f0">
    <circle cx="60" cy="70" r="1.6" opacity="0.7"/>
    <circle cx="150" cy="140" r="1.1" opacity="0.45"/>
    <circle cx="240" cy="60" r="1.4" opacity="0.6"/>
    <circle cx="330" cy="110" r="1" opacity="0.35"/>
    <circle cx="470" cy="70" r="1.5" opacity="0.65"/>
    <circle cx="560" cy="150" r="1.1" opacity="0.4"/>
    <circle cx="660" cy="55" r="1.3" opacity="0.55"/>
    <circle cx="745" cy="120" r="1.5" opacity="0.6"/>
    <circle cx="710" cy="230" r="1" opacity="0.3"/>
    <circle cx="90" cy="240" r="1.2" opacity="0.5"/>
    <circle cx="520" cy="200" r="1.2" opacity="0.45"/>
    <circle cx="200" cy="200" r="1" opacity="0.3"/>
    <circle cx="410" cy="45" r="1.3" opacity="0.5"/>
    <circle cx="300" cy="290" r="1" opacity="0.35"/>
    <circle cx="60" cy="350" r="1.4" opacity="0.5"/>
    <circle cx="760" cy="330" r="1.1" opacity="0.4"/>
  </g>

  <!-- Boden mit Perspektiv-Raster -->
  <rect x="0" y="415" width="800" height="185" fill="url(#floorGrad)"/>
  <g clip-path="url(#floorClip)" stroke="#94a3b8" fill="none">
    <g stroke-opacity="0.16" stroke-width="1">
      <line x1="400" y1="300" x2="-150" y2="600"/>
      <line x1="400" y1="300" x2="50" y2="600"/>
      <line x1="400" y1="300" x2="250" y2="600"/>
      <line x1="400" y1="300" x2="450" y2="600"/>
      <line x1="400" y1="300" x2="650" y2="600"/>
      <line x1="400" y1="300" x2="850" y2="600"/>
      <line x1="400" y1="300" x2="1050" y2="600"/>
    </g>
    <g stroke-opacity="0.14" stroke-width="1">
      <line x1="0" y1="425" x2="800" y2="425"/>
      <line x1="0" y1="448" x2="800" y2="448"/>
      <line x1="0" y1="478" x2="800" y2="478"/>
      <line x1="0" y1="518" x2="800" y2="518"/>
      <line x1="0" y1="570" x2="800" y2="570"/>
      <line x1="0" y1="600" x2="800" y2="600"/>
    </g>
  </g>

  <!-- Periodensystem-Wand (schwebendes Panel) -->
  <g transform="rotate(-3 690 200)">
    <rect x="595" y="80" width="190" height="255" rx="16" fill="#0f172a" opacity="0.88" stroke="#334155" stroke-width="1.5"/>
    <rect x="595" y="80" width="190" height="36" rx="16" fill="#1e293b"/>
    <rect x="595" y="100" width="190" height="16" fill="#1e293b"/>
    <circle cx="612" cy="98" r="5" fill="#2dd4bf"/>
    <text x="716" y="103" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Periodensystem</text>
    <!-- Kacheln 4x5 -->
    <g font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
      <rect x="604" y="128" width="40" height="32" rx="6" fill="#134e4a"/><text x="624" y="149" fill="#5eead4">H</text>
      <rect x="648" y="128" width="40" height="32" rx="6" fill="#1e293b"/><text x="668" y="149" fill="#cbd5e1">He</text>
      <rect x="692" y="128" width="40" height="32" rx="6" fill="#1e293b"/><text x="712" y="149" fill="#cbd5e1">Li</text>
      <rect x="736" y="128" width="40" height="32" rx="6" fill="#1e293b"/><text x="756" y="149" fill="#cbd5e1">Be</text>

      <rect x="604" y="164" width="40" height="32" rx="6" fill="#1e293b"/><text x="624" y="185" fill="#cbd5e1">B</text>
      <rect x="648" y="164" width="40" height="32" rx="6" fill="#1e293b"/><text x="668" y="185" fill="#cbd5e1">C</text>
      <rect x="692" y="164" width="40" height="32" rx="6" fill="#3f0d1c" stroke="#fb7185" stroke-opacity="0.7"/><text x="712" y="185" fill="#fda4af">N</text>
      <rect x="736" y="164" width="40" height="32" rx="6" fill="#3f0d1c" stroke="#fb7185" stroke-opacity="0.9"/><text x="756" y="185" fill="#fda4af">O</text>

      <rect x="604" y="200" width="40" height="32" rx="6" fill="#1e293b"/><text x="624" y="221" fill="#cbd5e1">F</text>
      <rect x="648" y="200" width="40" height="32" rx="6" fill="#1e293b"/><text x="668" y="221" fill="#cbd5e1">Ne</text>
      <rect x="692" y="200" width="40" height="32" rx="6" fill="#1e293b"/><text x="712" y="221" fill="#cbd5e1">Na</text>
      <rect x="736" y="200" width="40" height="32" rx="6" fill="#1e293b"/><text x="756" y="221" fill="#cbd5e1">Mg</text>

      <rect x="604" y="236" width="40" height="32" rx="6" fill="#1e293b"/><text x="624" y="257" fill="#cbd5e1">Al</text>
      <rect x="648" y="236" width="40" height="32" rx="6" fill="#1e293b"/><text x="668" y="257" fill="#cbd5e1">Si</text>
      <rect x="692" y="236" width="40" height="32" rx="6" fill="#312e81" stroke="#818cf8" stroke-opacity="0.6"/><text x="712" y="257" fill="#a5b4fc">Fe</text>
      <rect x="736" y="236" width="40" height="32" rx="6" fill="#312e81" stroke="#fbbf24" stroke-opacity="0.7"/><text x="756" y="257" fill="#fcd34d">Au</text>

      <rect x="604" y="272" width="40" height="32" rx="6" fill="#1e293b"/><text x="624" y="293" fill="#cbd5e1">Cu</text>
      <rect x="648" y="272" width="40" height="32" rx="6" fill="#1e293b"/><text x="668" y="293" fill="#cbd5e1">Zn</text>
      <rect x="692" y="272" width="40" height="32" rx="6" fill="#1e293b"/><text x="712" y="293" fill="#cbd5e1">Ag</text>
      <rect x="736" y="272" width="40" height="32" rx="6" fill="#1e293b"/><text x="756" y="293" fill="#cbd5e1">I</text>
    </g>
  </g>

  <!-- Umlaufbahnen um das Molekül -->
  <g fill="none">
    <ellipse cx="410" cy="330" rx="175" ry="72" stroke="#2dd4bf" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="6 9" transform="rotate(-18 410 330)"/>
    <ellipse cx="410" cy="330" rx="125" ry="46" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="5 8" transform="rotate(24 410 330)"/>
  </g>

  <!-- Verbindungslinien Avatare → Molekül (Kollaboration) -->
  <g fill="none" stroke-width="2" stroke-dasharray="4 7" stroke-linecap="round">
    <path d="M170 445 Q 250 380 355 345" stroke="#fbbf24" stroke-opacity="0.55"/>
    <path d="M265 432 Q 315 380 372 340" stroke="#818cf8" stroke-opacity="0.55"/>
    <path d="M355 452 Q 380 400 392 352" stroke="#34d399" stroke-opacity="0.55"/>
  </g>
  <g fill="#e2e8f0">
    <circle cx="228" cy="407" r="3.4" opacity="0.9"/>
    <circle cx="296" cy="395" r="3" opacity="0.8"/>
    <circle cx="378" cy="392" r="3.4" opacity="0.9"/>
  </g>

  <!-- Molekülmodell (Kugel-Stab-Modell) -->
  <g>
    <g stroke="#e2e8f0" stroke-opacity="0.75" stroke-width="6" stroke-linecap="round">
      <line x1="410" y1="330" x2="480" y2="272"/>
      <line x1="410" y1="330" x2="322" y2="282"/>
      <line x1="410" y1="330" x2="452" y2="398"/>
      <line x1="410" y1="330" x2="356" y2="392"/>
    </g>
    <circle cx="480" cy="272" r="25" fill="url(#atomO)"/>
    <circle cx="480" cy="272" r="8" fill="#fff" opacity="0.35"/>
    <circle cx="322" cy="282" r="25" fill="url(#atomN)"/>
    <circle cx="322" cy="282" r="8" fill="#fff" opacity="0.35"/>
    <circle cx="452" cy="398" r="16" fill="url(#atomH)"/>
    <circle cx="452" cy="398" r="5" fill="#fff" opacity="0.4"/>
    <circle cx="356" cy="392" r="16" fill="url(#atomH)"/>
    <circle cx="356" cy="392" r="5" fill="#fff" opacity="0.4"/>
    <circle cx="410" cy="330" r="33" fill="url(#atomC)"/>
    <circle cx="410" cy="330" r="11" fill="#fff" opacity="0.35"/>
    <!-- schwebende Teilchen um das Molekül -->
    <circle cx="300" cy="345" r="4" fill="#5eead4" opacity="0.8"/>
    <circle cx="520" cy="350" r="3.2" fill="#c4b5fd" opacity="0.8"/>
    <circle cx="455" cy="228" r="3.2" fill="#fda4af" opacity="0.8"/>
  </g>

  <!-- Avatar A (amber, mit VR-Brille) -->
  <g>
    <ellipse cx="150" cy="528" rx="34" ry="9" fill="#020617" opacity="0.4"/>
    <rect x="128" y="470" width="44" height="56" rx="22" fill="url(#bodyA)"/>
    <circle cx="150" cy="422" r="21" fill="url(#bodyA)"/>
    <!-- VR-Brille -->
    <path d="M138 420 a 12 10 0 0 1 24 0 z" fill="#0f172a"/>
    <rect x="136" y="418" width="28" height="13" rx="6" fill="#1e293b" stroke="#5eead4" stroke-opacity="0.6" stroke-width="1.2"/>
    <rect x="142" y="421" width="8" height="7" rx="2" fill="#2dd4bf"/>
    <rect x="154" y="421" width="8" height="7" rx="2" fill="#2dd4bf"/>
    <!-- Augen unterhalb Visier -->
    <circle cx="143" cy="434" r="2.4" fill="#0f172a"/>
    <circle cx="157" cy="434" r="2.4" fill="#0f172a"/>
  </g>

  <!-- Avatar B (indigo, winkt) -->
  <g>
    <ellipse cx="250" cy="522" rx="34" ry="9" fill="#020617" opacity="0.4"/>
    <rect x="228" y="464" width="44" height="56" rx="22" fill="url(#bodyB)"/>
    <circle cx="250" cy="416" r="21" fill="url(#bodyB)"/>
    <circle cx="243" cy="427" r="2.4" fill="#0f172a"/>
    <circle cx="257" cy="427" r="2.4" fill="#0f172a"/>
    <!-- Winken -->
    <path d="M272 470 q 12 -6 6 -18" stroke="#6366f1" stroke-width="7" stroke-linecap="round" fill="none"/>
    <circle cx="278" cy="451" r="8" fill="url(#bodyB)"/>
  </g>

  <!-- Avatar C (emerald, mit Chat-Blase) -->
  <g>
    <ellipse cx="340" cy="536" rx="34" ry="9" fill="#020617" opacity="0.4"/>
    <rect x="318" y="478" width="44" height="56" rx="22" fill="url(#bodyC)"/>
    <circle cx="340" cy="430" r="21" fill="url(#bodyC)"/>
    <circle cx="333" cy="441" r="2.4" fill="#0f172a"/>
    <circle cx="347" cy="441" r="2.4" fill="#0f172a"/>
    <!-- Chat-Blase -->
    <rect x="352" y="398" width="52" height="24" rx="12" fill="#e2e8f0"/>
    <path d="M366 420 l 4 8 8 -8 z" fill="#e2e8f0"/>
    <circle cx="366" cy="410" r="2.6" fill="#475569"/>
    <circle cx="378" cy="410" r="2.6" fill="#475569"/>
    <circle cx="390" cy="410" r="2.6" fill="#475569"/>
  </g>

  <!-- Schwebende UI-Chips (Hubs-Feeling) -->
  <g font-family="system-ui, sans-serif" font-size="13" font-weight="600">
    <g>
      <rect x="46" y="330" width="108" height="30" rx="15" fill="#0f172a" opacity="0.82" stroke="#2dd4bf" stroke-opacity="0.55"/>
      <circle cx="64" cy="345" r="6" fill="#2dd4bf"/>
      <path d="M60 342 h2 v6 h-2 z M64 340 h2 v10 h-2 z M68 342 h2 v6 h-2 z" fill="#0f172a"/>
      <text x="78" y="350" fill="#e2e8f0">Audio an</text>
    </g>
    <g>
      <rect x="56" y="376" width="96" height="30" rx="15" fill="#0f172a" opacity="0.82" stroke="#a78bfa" stroke-opacity="0.55"/>
      <rect x="70" y="382" width="12" height="9" rx="2.5" fill="#a78bfa"/>
      <text x="90" y="396" fill="#e2e8f0">Chat</text>
    </g>
  </g>

  <!-- Badge unten rechts -->
  <g>
    <rect x="622" y="548" width="150" height="32" rx="16" fill="#0f172a" opacity="0.85" stroke="#34d399" stroke-opacity="0.6"/>
    <circle cx="641" cy="564" r="5" fill="#34d399"/>
    <circle cx="641" cy="564" r="5" fill="#34d399" opacity="0.4"/>
    <circle cx="641" cy="564" r="9" fill="none" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="656" y="569" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#d1fae5">Beta · Live</text>
  </g>
</svg>
