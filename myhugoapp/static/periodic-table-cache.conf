# Cache-Konfiguration für /periodic-table/ statische Dateien
# Setzt lange Cache-Zeiten für unveränderliche Assets (Three.js, JS, CSS)
location /periodic-table/ {
    # Lange Cache-Zeit für statische Dateien
    expires 1y;
    add_header Cache-Control "public, immutable";
    
    # Gzip-Komprimierung für Text-basierte Dateien
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_vary on;
    gzip_comp_level 6;
    
    # Dateien direkt ausliefern
    try_files $uri $uri/ =404;
}
