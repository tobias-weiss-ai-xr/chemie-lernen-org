<!DOCTYPE html>
<html>

  {{ partial "head.html" .}}
  {{ block "css" . }}{{ end }}

  <body>

    {{ partial "header.html" . }}

    <div class="container">
      <div class="wrapper">
        {{ block "main" . }} {{ end }}
      </div>
    </div>

    {{ partial "footer.html" . }}    

  <!-- JS bundles are loaded via enhanced-bundle-loader.js in head.html -->
  <!-- Dark mode JS is bundled in the core bundle -->

  {{ with .Site.Params.analytics }}
    {{ partial "analytics.html" . }}
  {{ end }}
  {{ block "js" . }}{{ end }}
  </body>

</html>
