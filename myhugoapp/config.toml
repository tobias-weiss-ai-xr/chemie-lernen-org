baseURL = "https://chemie-lernen.org/"
languageCode = "de-de"
title = "chemie-lernen.org - interaktiv und quelloffen"
theme = "hugo-cards"

# Disable LiveReload in production
disableLiveReload = true
enableRobotsTXT = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)'], ['$', '$']]

[params]
  github = "tobias-weiss-ai-xr"
  custom_css = ["css/custom.css", "css/dark-mode.css"]
  custom_js = ["js/dark-mode.js"]
  defaultImage = "recent-article_001.jpg"
  footer_description = "chemie-lernen.org - Ihre Plattform für innovativse Chemie-Lernen. Chemische Grundlagen und Konzepte greifbar und erlebbar."

[params.meta]
  keywords = "chemie-lernen.org, VR Chemieunterricht, Virtual Reality Bildung, Chemie lernen online, interaktiver Chemieunterricht, digitale Bildung, Chemie studieren, innovative Chemie, immersive Bildung"

author = "chemie-lernen.org Team"

# Search Index Configuration
[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML", "RSS"]

[outputFormats]
  [outputFormats.JSON]
    mediaType = "application/json"
    baseName = "index"
    isPlainText = true
    notAlternative = true

[mediaTypes]
  [mediaTypes."application/json"]
    suffixes = ["json"]

