{{ define "main" }}

<div class="quiz-page">
  <div class="quiz-container">
    <h1 class="quiz-title">Chemie-Quiz</h1>
    <p class="quiz-subtitle">Teste dein Chemie-Wissen aus allen Bereichen</p>

    <!-- Topic Selection -->
    <div class="quiz-header" id="quiz-header">
      <label for="quiz-topic-select" class="quiz-topic-label">Thema auswählen:</label>
      <select id="quiz-topic-select" class="quiz-topic-select">
        <option value="">— Bitte wählen —</option>
        <option value="Allgemeine Chemie">Allgemeine Chemie</option>
        <option value="Anorganische Chemie">Anorganische Chemie</option>
        <option value="Organische Chemie">Organische Chemie</option>
        <option value="Physikalische Chemie">Physikalische Chemie</option>
        <option value="Biochemie">Biochemie</option>
        <option value="alle">Alle Themen (30 Fragen)</option>
      </select>
      <button id="quiz-start-btn" class="quiz-btn quiz-btn-primary quiz-btn-start" disabled>
        Quiz starten
      </button>
    </div>

    <!-- Review reminder banner -->
    <div id="quiz-review-banner" class="quiz-review-banner hidden">
      <span class="quiz-review-banner-icon">🔔</span>
      <span id="quiz-review-banner-text">Du hast fällige Wiederholungen.</span>
      <button id="quiz-review-banner-btn" class="quiz-btn quiz-btn-small">Wiederholen</button>
    </div>

    <!-- Quiz Area -->
    <div id="quiz-area" class="quiz-area">
      <div class="quiz-empty-state">
        <p>Wähle ein Thema und klicke auf "Quiz starten".</p>
      </div>
    </div>
  </div>
</div>

<style>
/* ── Quiz Page Styles ────────────────────────────── */
.quiz-page {
  max-width: 800px;
  margin: 2rem auto;
  padding: 0 1rem;
}

.quiz-container {
  background: #fff;
  border-radius: 16px;
  padding: 2rem;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
}

.quiz-title {
  font-size: 1.8rem;
  font-weight: 700;
  color: #1a1a2e;
  margin: 0 0 0.25rem;
  text-align: center;
}

.quiz-subtitle {
  text-align: center;
  color: #666;
  margin: 0 0 1.5rem;
  font-size: 1rem;
}

/* Header / Topic Selection */
.quiz-header {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 1rem;
  background: #f8f9fa;
  border-radius: 12px;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
}

.quiz-topic-label {
  font-weight: 600;
  color: #333;
  font-size: 0.95rem;
  white-space: nowrap;
}

.quiz-topic-select {
  flex: 1;
  min-width: 200px;
  padding: 0.6rem 1rem;
  border: 2px solid #ddd;
  border-radius: 8px;
  font-size: 0.95rem;
  background: #fff;
  cursor: pointer;
  transition: border-color 0.15s;
}

.quiz-topic-select:focus {
  border-color: #4a90d9;
  outline: none;
}

/* Buttons */
.quiz-btn {
  padding: 0.6rem 1.5rem;
  border: none;
  border-radius: 8px;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}

.quiz-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.quiz-btn-primary {
  background: #4a90d9;
  color: #fff;
}
.quiz-btn-primary:hover:not(:disabled) {
  background: #357ab8;
}

.quiz-btn-secondary {
  background: #6c757d;
  color: #fff;
}
.quiz-btn-secondary:hover:not(:disabled) {

}

.quiz-btn-skip {

  color: #999;
  border: 1px solid #ddd;
}
.quiz-btn-skip:hover {

  color: #666;
}

.quiz-btn-small {
  padding: 0.35rem 0.8rem;
  font-size: 0.85rem;
  background: #4a90d9;
  color: #fff;
  white-space: nowrap;
}
.quiz-btn-small:hover {

}

.quiz-btn-start {

}

/* Progress Bar */
.quiz-progress-bar {

}

.quiz-progress-fill {

}

.quiz-progress-text {

/* Timer */
.quiz-timer {

.quiz-timer-warning {

@keyframes pulse {

/* Topic Badge */
.quiz-topic-badge {

/* Question Text */

.quiz-type-label {

@keyframes fadeIn {
  from { opacity: 0; transform: translate(-50%, -50%) scale(0.95); }

/* Results Screen */
.quiz-results-header {

}

.quiz-results-header h2 {

.quiz-score-great {

}

}

}

.quiz-results-stats {

.quiz-stat {

/* Review Section */
.quiz-review-section {
  margin: 1.5rem 0;
}

.quiz-review-section h3 {
  font-size: 1.1rem;

.quiz-review-item {

.quiz-review-skipped {

.quiz-review-correct {

}

.quiz-review-explanation {
  margin-top: 0.35rem;
  font-size: 0.85rem;
  color: #888;

}

/* Results Actions */
.quiz-results-actions {
  display: flex;
  gap: 0.75rem;
  justify-content: center;
  margin-top: 1rem;
}

/* Review Banner */
.quiz-review-banner {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.75rem 1rem;
  background: #fff8e1;

.quiz-review-banner-icon {

}

/* Empty State */
.quiz-empty {
  text-align: center;
  padding: 3rem 1rem;

}

.quiz-empty-state {
  text-align: center;
  padding: 3rem 1rem;
  color: #999;
}

/* Area */
.quiz-area {
  min-height: 200px;
}

/* Hidden */
.hidden {
  display: none !important;
}

/* ── Dark Mode ────────────────────────────────── */
@media (prefers-color-scheme: dark) {
  .quiz-container {

<script src="/js/quiz-engine.js"></script>
<script src="/js/quiz-questions.js"></script>
<script src="/js/quiz-ui.js"></script>
<script src="/js/sm2.js"></script>
<script>
;(function () {
  'use strict';

  var quizEngine = null;
  var quizUI = null;
  var currentTopic = '';
  var currentQuestions = [];

  var topicSelect = document.getElementById('quiz-topic-select');
  var startBtn = document.getElementById('quiz-start-btn');
  var quizArea = document.getElementById('quiz-area');

  // ── Review banner ─────────────────────────────
  var reviewBanner = document.getElementById('quiz-review-banner');
  var reviewBannerText = document.getElementById('quiz-review-banner-text');
  var reviewBannerBtn = document.getElementById('quiz-review-banner-btn');

  function checkDueCards() {
    try {
      var stored = localStorage.getItem('chemie-sm2-cards');
      if (!stored) {
        reviewBanner.classList.add('hidden');
        return;
      }
      var cards = JSON.parse(stored);
      var dueCards = [];
      var now = new Date();
      for (var key in cards) {
        var card = cards[key];
        if (card.status === 'failed' || !card.lastReview) {
          dueCards.push(card);
          continue;
        }
        var lastReview = new Date(card.lastReview);
        var nextDate = new Date(lastReview);
        nextDate.setDate(nextDate.getDate() + (card.interval || 1));
        if (nextDate <= now) {
          dueCards.push(card);
        }
      }
      if (dueCards.length > 0) {
        reviewBannerText.textContent =
          dueCards.length + ' Frage(n) zur Wiederholung fällig.';
        reviewBanner.classList.remove('hidden');
      } else {
        reviewBanner.classList.add('hidden');
      }
    } catch (e) {
      reviewBanner.classList.add('hidden');
    }
  }

  reviewBannerBtn.addEventListener('click', function () {
    // Find wrong-answer questions from SM-2 storage
    var cards;
    try {
      cards = JSON.parse(localStorage.getItem('chemie-sm2-cards') || '{}');
    } catch (e) {
      cards = {};
    }

    var wrongIds = [];
    for (var key in cards) {
      if (cards[key].status === 'failed') {
        wrongIds.push(key);
      }
    }

    // Filter questions to review
    if (wrongIds.length > 0) {
      var allQuestions = window.quizQuestions || [];
      var reviewQuestions = allQuestions.filter(function (q) {
        return wrongIds.indexOf(String(q.id)) !== -1;
      });
      if (reviewQuestions.length === 0) {
        // Fallback: load all questions
        reviewQuestions = allQuestions.slice();
      }
      startQuiz(reviewQuestions, 'Wiederholung');
    } else {
      // No wrong cards, load all
      var allQs = window.quizQuestions || [];
      startQuiz(allQs, 'Wiederholung');
    }
  });

  // ── Topic selection ───────────────────────────
  topicSelect.addEventListener('change', function () {
    startBtn.disabled = !this.value;
  });

  startBtn.addEventListener('click', function () {
    var topic = topicSelect.value;
    if (!topic) return;

    var allQuestions = window.quizQuestions || [];

    // ── Adaptive difficulty (evidence-based: 70–80% sweet spot) ──
    // Fetch per-topic recommendation before starting; show it non-blocking.
    fetch('/api/adaptive/recommendations/' + encodeURIComponent(topic), {
      signal: AbortSignal.timeout(4000),
    })
      .then(function (r) {
        return r.ok ? r.json() : null;
      })
      .then(function (rec) {
        if (rec && rec.authenticated && rec.difficulty && rec.accuracy != null) {
          var badge = { leicht: 'success', mittel: 'warning', schwer: 'danger' };
          var labels = { leicht: 'Leicht empfohlen', mittel: 'Optimales Niveau', schwer: 'Herausforderung empfohlen' };
          var hint = document.getElementById('quiz-adaptive-hint');
          if (!hint) {
            hint = document.createElement('div');
            hint.id = 'quiz-adaptive-hint';
            hint.className = 'quiz-adaptive-hint';
            quizArea.parentNode.insertBefore(hint, quizArea);
          }
          hint.innerHTML =
            '<div class="alert alert-info quiz-adaptive-alert">' +
            '<i class="fa fa-line-chart"></i> ' +
            '<strong>Adaptive Empfehlung:</strong> ' +
            '<span class="label label-' + (badge[rec.difficulty] || 'default') + '">' +
            (labels[rec.difficulty] || rec.difficulty) +
            '</span> ' +
            '<span class="text-muted">(Trefferquote: ' + rec.accuracy + '%, ' +
            rec.sampleSize + ' Versuche)</span>' +
            '<button type="button" class="close" onclick="this.parentNode.remove()">&times;</button>' +
            '</div>';
        }
      })
      .catch(function () {
        /* ignore — adaptive hint is non-critical */
      });

    if (topic === 'alle') {
      startQuiz(allQuestions, 'Alle Themen');
    } else {
      var filtered = allQuestions.filter(function (q) {
        return q.topic === topic;
      });
      startQuiz(filtered, topic);
    }
  });

  // ── Start quiz ────────────────────────────────
  function startQuiz(questions, topic) {
    if (!questions || questions.length === 0) {
      quizArea.innerHTML = '<div class="quiz-empty"><p>Keine Fragen für dieses Thema verfügbar.</p></div>';
      return;
    }

    currentTopic = topic;
    currentQuestions = questions;

    // Clean up previous
    if (quizUI) {
      quizUI.destroy();
    }
    if (quizEngine) {
      quizEngine.destroy();
    }

    quizArea.innerHTML = ''; // clear area

    quizUI = new QuizUI(quizArea, {
      onRetry: function () {
        startQuiz(currentQuestions, currentTopic);
      },
      onWiederholen: function (reviewItems) {
        var wrongQuestions = reviewItems
          .filter(function (item) { return !item.correct; })
          .map(function (item) { return item.question; });
        if (wrongQuestions.length === 0) {
          wrongQuestions = currentQuestions.slice();
        }
        startQuiz(wrongQuestions, currentTopic + ' (Wiederholung)');
      },
    });

    quizEngine = new QuizEngine();
    quizEngine.loadQuestions(questions, {
      shuffle: true,
    });

    quizUI.start(quizEngine);

    // Store SM-2 results when complete
    var originalComplete = quizEngine.onComplete;
    quizEngine.onComplete = function (results) {
      // Save SM-2 data
      saveSM2Results(results);
      if (originalComplete) {
        originalComplete(results);
      }
    };
  }

  // ── SM-2 persistence ──────────────────────────
  function saveSM2Results(results) {
    try {
      var SM2 = window.SM2;
      if (!SM2) return;

      var stored = localStorage.getItem('chemie-sm2-cards');
      var cards = stored ? JSON.parse(stored) : {};

      for (var i = 0; i < results.answers.length; i++) {
        var ans = results.answers[i];
        if (!ans.question) continue;

        var cardId = String(ans.question.id);
        var existingCard = cards[cardId] || {
          id: cardId,
          ease: 2.5,
          interval: 0,
          repetitions: 0,
          lastReview: null,
          status: 'new',
        };

        // Map answer to quality (0-5)
        var quality;
        if (ans.skipped) {
          quality = 0;
        } else if (ans.correct) {
          quality = 4; // good recall
        } else if (ans.partial) {
          quality = 2; // difficult
        } else {
          quality = 1; // incorrect
        }

        var sm2Result = SM2.calculate(
          quality,
          existingCard.repetitions,
          existingCard.ease,
          existingCard.interval
        );

        cards[cardId] = {
          id: cardId,
          ease: sm2Result.ease,
          interval: sm2Result.interval,
          repetitions: sm2Result.repetitions,
          lastReview: new Date().toISOString(),
          status: sm2Result.status,
        };
      }

      localStorage.setItem('chemie-sm2-cards', JSON.stringify(cards));
      localStorage.setItem(
        'chemie-quiz-last-result',
        JSON.stringify({
          topic: currentTopic,
          score: results.score,
          total: results.total,
          percentage: results.percentage,
          date: new Date().toISOString(),
        })
      );

      // Sync wrong answers to server-side FSRS (evidence-based loop):
      // wrong quiz answers become spaced-repetition cards (day 3/7/14/30).
      syncWrongAnswersToFsrs(results);

      // Re-check due cards for review banner
      checkDueCards();
    } catch (e) {
      // localStorage might be full or unavailable
    }
  }

  // ── Server-side FSRS sync (evidence-based loop) ──────
  // Wrong quiz answers become spaced-repetition cards via
  // POST /api/fsrs/cards. Reviews happen on /lernkarten-review/.
  function syncWrongAnswersToFsrs(results) {
    var wrongAnswers = (results.answers || []).filter(function (a) {
      return a && a.question && !a.correct;
    });
    if (wrongAnswers.length === 0) return;

    // Send each wrong answer as a separate card (fire-and-forget).
    wrongAnswers.forEach(function (wa) {
      fetch('/api/fsrs/cards', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({
          topicId: currentTopic,
          question: wa.question.question,
          answer: buildCardAnswer(wa.question),
          type: wa.question.type || 'flashcard',
        }),
      }).catch(function () {
        // Non-fatal: offline users or anonymous users are unaffected
      });
    });
  }

  function buildCardAnswer(q) {
    var answerText = '';
    if (q.correctAnswer) {
      answerText = String(q.correctAnswer);
    } else if (Array.isArray(q.correctIndices)) {
      answerText = (q.correctIndices || [])
        .map(function (idx) {
          return (q.options || [])[idx];
        })
        .filter(Boolean)
        .join(', ');
    } else if (q.correctIndex !== undefined && q.options) {
      answerText = q.options[q.correctIndex] || '';
    }
    if (q.explanation) {
      answerText = answerText ? answerText + ' — ' + q.explanation : q.explanation;
    }
    return answerText || q.question;
  }

  // ── Initialize ────────────────────────────────
  checkDueCards();
})();
</script>
