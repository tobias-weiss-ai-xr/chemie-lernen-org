{{ partial "head.html" . }}

<div class="calculator-container">
  <div class="container">
    <div class="row">
      <div class="col-md-8 col-md-offset-2">
        <h1 class="text-center">{{ .Title }}</h1>
        <p class="lead text-center">{{ .Description }}</p>

        {{ .Content }}

        <hr>

        <form id="verduennungsreihen-form" class="calculator-form">
          <div class="form-group">
            <label for="initial-concentration">Ausgangskonzentration (mol/L):</label>
            <input type="number" id="initial-concentration" class="form-control" placeholder="1.0" step="0.01" required>
          </div>

          <div class="form-group">
            <label for="num-steps">Anzahl Schritte:</label>
            <input type="number" id="num-steps" class="form-control" placeholder="5" min="1" max="20" step="1" required>
          </div>

          <div class="form-group">
            <label for="unit">Einheit:</label>
            <select id="unit" class="form-control">
              <option value="mol/L">mol/L</option>
              <option value="mM">mM</option>
              <option value="μM">μM</option>
              <option value="g/L">g/L</option>
              <option value="mg/mL">mg/mL</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Berechnen</button>
        </form>

        <div id="result" class="result-box hidden" aria-live="polite">
          <h3>Verduennungsreihe (1:2)</h3>
          <table class="table table-striped table-bordered">
            <thead>
              <tr>
                <th>Schritt</th>
                <th>Verdhunungsverhltnis</th>
                <th>Konzentration</th>
                <th>Verduennungsfaktor</th>
              </tr>
            </thead>
            <tbody id="dilution-table">
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
.calculator-form {
  margin-top: 30px;
  margin-bottom: 30px;
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  font-weight: 600;
  margin-bottom: 5px;
}

.result-box {
  margin-top: 20px;
  padding: 20px;
  background-color: #f8f9fa;
  border: 2px solid var(--green-primary);
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.result-box h3 {
  margin-top: 0;
  color: var(--blue-primary);
}

.table {
  margin-top: 15px;
}

.table thead {
  background-color: var(--green-primary);
  color: #fff;
}

.table tbody tr:nth-child(even) {
  background-color: #f2f2f2;
}

@media (prefers-color-scheme: dark) {
  .result-box {
    background-color: #2c2c2c;
    border-color: var(--green-primary);
  }

  .table thead {
    background-color: #2c2c2c;
    color: #e0e0e0;
  }

  .table tbody tr:nth-child(even) {
    background-color: #3c3c3c;
  }
}
</style>

<script src="/js/calculators/verduennungsreihen-rechner.js"></script>

{{ partial "footer.html" . }}
