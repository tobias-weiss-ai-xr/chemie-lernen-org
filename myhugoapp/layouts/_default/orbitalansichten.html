{{ define "title" }}{{ .Title }}{{ end }}

{{ define "css" }}
<style>
  .orbitalansichten-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
  }

  .orbitalansichten-container h1 {
    text-align: center;
    margin-bottom: 8px;
    font-size: 1.8rem;
  }

  .orbitalansichten-container .lead {
    text-align: center;
    color: #666;
    margin-bottom: 24px;
  }

  .orbitalansichten-container table {
    width: 100%;
    border-collapse: collapse;
    margin: 20px 0;
  }

  .orbitalansichten-container th,
  .orbitalansichten-container td {
    border: 1px solid #ddd;
    padding: 8px 12px;
    text-align: left;
  }

  .orbitalansichten-container th {
    background: var(--header-bg, #f0f4ff);
    font-weight: 600;
  }

  .orbital-viewer-section {
    margin: 32px 0;
  }

  .orbital-viewer-section h2 {
    text-align: center;
    margin-bottom: 16px;
  }

  @media (prefers-color-scheme: dark) {html:not([data-theme]) .orbitalansichten-container .lead {
      color: #aaa;
    }html:not([data-theme]) .orbitalansichten-container th {
      background: #2c2c2c;
    }html:not([data-theme]) .orbitalansichten-container th, html:not([data-theme]) .orbitalansichten-container td {
      border-color: #444;
    }html:not([data-theme]) .orbitalansichten-container h1 {
      color: #e0e0e0;
    }
  }
/* UXF-058: data-theme=dark-Zwilling des obigen prefers-Blocks */
[data-theme='dark'] .orbitalansichten-container .lead {
      color: #aaa;
    }[data-theme='dark'] .orbitalansichten-container th {
      background: #2c2c2c;
    }[data-theme='dark'] .orbitalansichten-container th, [data-theme='dark'] .orbitalansichten-container td {
      border-color: #444;
    }[data-theme='dark'] .orbitalansichten-container h1 {
      color: #e0e0e0;
    }
  

  @media (max-width: 768px) {
    .orbitalansichten-container {
      padding: 10px;
    }
  }
</style>
{{ end }}

{{ define "main" }}
<article class="orbitalansichten-container">
  {{ .Content }}
</article>
{{ end }}

{{ define "js" }}{{ end }}
