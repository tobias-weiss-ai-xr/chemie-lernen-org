{{ define "main" }}

<div id="entity-app">
  <div style="text-align:center;padding:3em 1em;">
    <div class="spinner-border text-primary mb-3" role="status"><span class="visually-hidden">Loading...</span></div>
    <h5>Lade Wissensnetz...</h5>
  </div>
</div>

<style>
#entity-app { margin-top: 1rem; margin-bottom: 2rem; }

.entity-header {
  display: flex; flex-wrap: wrap; align-items: center; gap: 1rem;
  margin-bottom: 1.5rem; padding-bottom: 1rem;
  border-bottom: 2px solid var(--border-color, #e0e0e0);
}
.entity-header h1 { margin: 0; flex: 1; font-size: 1.6rem; }

.entity-stats {
  display: flex; gap: 1rem; flex-wrap: wrap;
  font-size: 0.9rem; color: var(--text-muted, #666);
  align-items: center;
}
.entity-stats strong { color: var(--text-primary, #333); }

.entity-toolbar {
  display: flex; flex-wrap: wrap; gap: 0.5rem;
  margin-bottom: 1rem; align-items: center;
}
.entity-toolbar-left { flex: 1; min-width: 200px; }

.entity-search {
  width: 100%; padding: 0.6rem 1rem; border-radius: 8px;
  border: 1px solid var(--border-color, #ddd); font-size: 1rem;
  background: var(--bg-input, #fff); color: var(--text-primary, #333);
  transition: border-color 0.2s, box-shadow 0.2s;
  box-sizing: border-box;
}
.entity-search:focus {
  outline: none; border-color: #667eea;
  box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
}

.entity-view-controls {
  display: flex; gap: 0.3rem;
}
.entity-view-btn {
  padding: 0.4rem 0.75rem; border-radius: 6px; font-size: 0.82rem;
  border: 1.5px solid var(--border-color, #ddd); cursor: pointer;
  background: var(--bg-card, #fff); color: var(--text-muted, #666);
  transition: all 0.2s; font-weight: 500;
}
.entity-view-btn:hover { border-color: #667eea; color: #667eea; }
.entity-view-btn.active { background: #667eea; color: #fff; border-color: #667eea; }

.entity-filters {
  display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1.5rem;
}
.entity-filter-btn {
  padding: 0.35rem 0.9rem; border-radius: 20px; font-size: 0.82rem;
  border: 1.5px solid var(--border-color, #ddd); cursor: pointer;
  background: var(--bg-card, #fff); color: var(--text-muted, #666);
  transition: all 0.2s; font-weight: 500;
}
.entity-filter-btn:hover { border-color: #667eea; color: #667eea; }
.entity-filter-btn.active {
  background: #667eea; color: #fff; border-color: #667eea;
}
.entity-filter-count {
  font-size: 0.72rem; opacity: 0.7; margin-left: 3px;
}

.entity-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 1rem;
}

.entity-card {
  background: var(--bg-card, #fff);
  border: 1px solid var(--border-color, #e0e0e0);
  border-radius: 10px; padding: 1.2rem;
  cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  position: relative; overflow: hidden;
}
.entity-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 16px rgba(0,0,0,0.12);
}
.entity-card:active { transform: translateY(-1px); }
.entity-card::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0;
  height: 3px; border-radius: 10px 10px 0 0;
}
.entity-card[data-cat="stoff"]::before { background: #667eea; }
.entity-card[data-cat="konzept"]::before { background: #45b7d1; }
.entity-card[data-cat="reaktion"]::before { background: #4ecdc4; }
.entity-card[data-cat="methode"]::before { background: #f093fb; }
.entity-card[data-cat="person"]::before { background: #ff9a76; }
.entity-card[data-cat="quelle"]::before { background: #a8a8a8; }

.entity-card-name {
  font-size: 1.15rem; font-weight: 600; margin: 0 0 0.4rem 0;
  color: var(--text-primary, #333);
}
.entity-card-name a {
  color: inherit; text-decoration: none;
}
.entity-card-name a:hover { color: #667eea; }

.entity-card-cat {
  display: inline-block; padding: 0.15rem 0.55rem; border-radius: 12px;
  font-size: 0.72rem; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.03em; margin-bottom: 0.6rem;
}
.entity-card[data-cat="stoff"] .entity-card-cat { background: rgba(102,126,234,0.12); color: #667eea; }
.entity-card[data-cat="konzept"] .entity-card-cat { background: rgba(69,183,209,0.12); color: #45b7d1; }
.entity-card[data-cat="reaktion"] .entity-card-cat { background: rgba(78,205,196,0.12); color: #2ea69e; }
.entity-card[data-cat="methode"] .entity-card-cat { background: rgba(240,147,251,0.12); color: #c060d0; }
.entity-card[data-cat="person"] .entity-card-cat { background: rgba(255,154,118,0.12); color: #d07040; }
.entity-card[data-cat="quelle"] .entity-card-cat { background: rgba(168,168,168,0.12); color: #888; }

.entity-card-meta {
  font-size: 0.82rem; color: var(--text-muted, #888); margin-bottom: 0.5rem;
}

.entity-card-components {
  margin-top: 0.5rem; font-size: 0.78rem; color: var(--text-muted, #888);
}
.entity-card-components strong { color: var(--text-primary, #555); font-size: 0.75rem; }

.entity-card-related {
  margin-top: 0.5rem; display: flex; flex-wrap: wrap; gap: 0.3rem;
}
.entity-related-tag {
  font-size: 0.7rem; padding: 0.1rem 0.45rem; border-radius: 4px;
  background: var(--bg-tag, #f0f0f0); color: var(--text-muted, #666);
}

.entity-card-articles {
  margin-top: 0.5rem; padding-top: 0.4rem;
  border-top: 1px dashed var(--border-color, #ddd);
  font-size: 0.72rem; color: var(--text-muted, #888);
  max-height: 0; overflow: hidden;
  transition: max-height 0.3s ease;
}
.entity-card:hover .entity-card-articles,
.entity-card.show-articles .entity-card-articles {
  max-height: 200px;
}
.entity-card-articles div {
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  padding: 0.1rem 0;
}
.entity-card-articles div::before { content: "\2022 "; color: #667eea; }

.empty-state {
  text-align: center; padding: 3em 1em; color: var(--text-muted, #888);
  grid-column: 1 / -1;
}
.empty-state-icon { font-size: 2.5rem; margin-bottom: 0.5rem; opacity: 0.4; }

/* Skeleton loading */
@keyframes skeleton-pulse {
  0% { opacity: 0.6; }
  50% { opacity: 1; }
  100% { opacity: 0.6; }
}
.entity-skeleton-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 1rem;
}
.entity-skeleton-card {
  background: var(--bg-card, #fff);
  border: 1px solid var(--border-color, #e0e0e0);
  border-radius: 10px; padding: 1.2rem;
  animation: skeleton-pulse 1.5s ease-in-out infinite;
}
.entity-skeleton-line {
  height: 14px; background: var(--border-color, #e0e0e0);
  border-radius: 4px; margin-bottom: 10px;
}
.entity-skeleton-line:first-child { width: 70%; height: 18px; }
.entity-skeleton-line:nth-child(2) { width: 40%; }
.entity-skeleton-line:nth-child(3) { width: 90%; }
.entity-skeleton-line:nth-child(4) { width: 55%; }

/* Tag cloud layout */
.entity-tagcloud {
  display: flex; flex-wrap: wrap; gap: 0.5rem;
  justify-content: center; padding: 1rem 0;
}
.entity-tagcloud-item {
  display: inline-block; padding: 0.3rem 0.8rem;
  border-radius: 20px; cursor: pointer; text-decoration: none;
  transition: transform 0.2s, box-shadow 0.2s;
  color: #fff; font-weight: 500;
}
.entity-tagcloud-item:hover {
  transform: scale(1.1);
  box-shadow: 0 3px 10px rgba(0,0,0,0.2);
}

/* Tooltip */
.entity-tooltip-wrapper {
  position: relative;
}
.entity-tooltip {
  display: none; position: fixed;
  background: var(--bg-card, #fff);
  border: 1px solid var(--border-color, #ddd);
  border-radius: 8px; padding: 0.8rem;
  box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  z-index: 1000; max-width: 300px;
  font-size: 0.78rem; pointer-events: none;
}

/* Pagination */
.entity-pagination {
  display: flex; justify-content: center; gap: 0.4rem;
  margin-top: 1.5rem; flex-wrap: wrap;
}
.entity-page-btn {
  padding: 0.35rem 0.75rem; border-radius: 6px; font-size: 0.82rem;
  border: 1.5px solid var(--border-color, #ddd); cursor: pointer;
  background: var(--bg-card, #fff); color: var(--text-muted, #666);
  transition: all 0.2s; font-weight: 500; min-width: 36px;
}
.entity-page-btn:hover { border-color: #667eea; color: #667eea; }
.entity-page-btn.active { background: #667eea; color: #fff; border-color: #667eea; }
.entity-page-btn:disabled { opacity: 0.4; cursor: default; }

.entity-graph-link {
  text-align: center; margin-top: 2rem; font-size: 0.9rem;
}
.entity-graph-top-link {
  display: inline-block; font-size: 0.82rem; font-weight: 500;
  padding: 0.3rem 0.8rem; border-radius: 6px;
  background: var(--bg-card, #f0f4ff); color: #667eea;
  text-decoration: none; transition: background 0.2s;
}
.entity-graph-top-link:hover { background: #667eea; color: #fff; }

/* Sort dropdown */
.entity-sort-select {
  padding: 0.4rem 0.75rem; border-radius: 6px; font-size: 0.82rem;
  border: 1.5px solid var(--border-color, #ddd); cursor: pointer;
  background: var(--bg-card, #fff); color: var(--text-muted, #666);
  transition: border-color 0.2s;
}
.entity-sort-select:focus {
  outline: none; border-color: #667eea;
}

/* Dark mode via Hugo theme variable */
[data-theme="dark"] .entity-card,
.dark .entity-card {
  background: #2c2c2c; border-color: #444;
}
[data-theme="dark"] .entity-search,
.dark .entity-search {
  background: #333; border-color: #555; color: #eee;
}
[data-theme="dark"] .entity-filter-btn,
.dark .entity-filter-btn,
[data-theme="dark"] .entity-view-btn,
.dark .entity-view-btn,
[data-theme="dark"] .entity-sort-select,
.dark .entity-sort-select,
[data-theme="dark"] .entity-page-btn,
.dark .entity-page-btn {
  background: #333; border-color: #555; color: #bbb;
}
[data-theme="dark"] .entity-related-tag,
.dark .entity-related-tag {
  background: #3c3c3c; color: #aaa;
}
[data-theme="dark"] .entity-card-name,
.dark .entity-card-name { color: #e0e0e0; }
[data-theme="dark"] .entity-card-meta,
.dark .entity-card-meta,
[data-theme="dark"] .entity-skeleton-card,
.dark .entity-skeleton-card { color: #999; }
[data-theme="dark"] .entity-skeleton-line,
.dark .entity-skeleton-line { background: #444; }
[data-theme="dark"] .entity-tooltip,
.dark .entity-tooltip { background: #2c2c2c; border-color: #444; }
[data-theme="dark"] .entity-graph-top-link,
.dark .entity-graph-top-link { background: rgba(102,126,234,0.15); }

/* Standalone dark mode via media query */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .entity-card { background: #2c2c2c; border-color: #444; }
  :root:not([data-theme="light"]) .entity-search { background: #333; border-color: #555; color: #eee; }
  :root:not([data-theme="light"]) .entity-filter-btn,
  :root:not([data-theme="light"]) .entity-view-btn,
  :root:not([data-theme="light"]) .entity-sort-select,
  :root:not([data-theme="light"]) .entity-page-btn { background: #333; border-color: #555; color: #bbb; }
  :root:not([data-theme="light"]) .entity-related-tag { background: #3c3c3c; color: #aaa; }
  :root:not([data-theme="light"]) .entity-card-name { color: #e0e0e0; }
  :root:not([data-theme="light"]) .entity-card-meta { color: #999; }
  :root:not([data-theme="light"]) .entity-skeleton-line { background: #444; }
  :root:not([data-theme="light"]) .entity-tooltip { background: #2c2c2c; border-color: #444; }
  :root:not([data-theme="light"]) .entity-graph-top-link { background: rgba(102,126,234,0.15); }
}

@media (max-width: 768px) {
  .entity-header { flex-direction: column; align-items: flex-start; }
  .entity-grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 0.7rem; }
  .entity-card { padding: 0.9rem; }
  .entity-skeleton-grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
  .entity-toolbar { flex-direction: column; }
  .entity-toolbar-left { min-width: auto; width: 100%; }
}
</style>

<div id="entity-skeleton" class="entity-skeleton-grid">
  <div class="entity-skeleton-card"><div class="entity-skeleton-line"></div><div class="entity-skeleton-line"></div><div class="entity-skeleton-line"></div><div class="entity-skeleton-line"></div></div>
  <div class="entity-skeleton-card"><div class="entity-skeleton-line"></div><div class="entity-skeleton-line"></div><div class="entity-skeleton-line"></div><div class="entity-skeleton-line"></div></div>
  <div class="entity-skeleton-card"><div class="entity-skeleton-line"></div><div class="entity-skeleton-line"></div><div class="entity-skeleton-line"></div><div class="entity-skeleton-line"></div></div>
  <div class="entity-skeleton-card"><div class="entity-skeleton-line"></div><div class="entity-skeleton-line"></div><div class="entity-skeleton-line"></div><div class="entity-skeleton-line"></div></div>
  <div class="entity-skeleton-card"><div class="entity-skeleton-line"></div><div class="entity-skeleton-line"></div><div class="entity-skeleton-line"></div><div class="entity-skeleton-line"></div></div>
  <div class="entity-skeleton-card"><div class="entity-skeleton-line"></div><div class="entity-skeleton-line"></div><div class="entity-skeleton-line"></div><div class="entity-skeleton-line"></div></div>
</div>

<script>
(function(){
var app=document.getElementById("entity-app");
var skeleton=document.getElementById("entity-skeleton");

function toSlug(name){
return name.toLowerCase()
.replace(/[üÜ]/g,'ue').replace(/[öÖ]/g,'oe').replace(/[äÄ]/g,'ae')
.replace(/ß/g,'ss')
.replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
}

function escapeHtml(s){
return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

var data;
fetch("/api/kg-data",{signal:AbortSignal.timeout(15000)})
.then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
.then(function(d){
data=d;
skeleton.style.display="none";
init(d);
})
.catch(function(){
skeleton.style.display="none";
app.innerHTML="<div class=\"empty-state\"><div class=\"empty-state-icon\">📡</div><p>Wissensnetz konnte nicht geladen werden.</p><p><a href=\"/wissennetz/\" style=\"color:#667eea;\">Graph-Ansicht öffnen →</a></p></div>";
});

function init(data){
var entities=data.entities||[];
var articles=data.articles||[];

var catLabels={stoff:"Stoff",konzept:"Konzept",reaktion:"Reaktion",methode:"Methode",person:"Person",quelle:"Quelle"};
var catColors={stoff:"#667eea",konzept:"#45b7d1",reaktion:"#4ecdc4",methode:"#f093fb",person:"#ff9a76",quelle:"#a8a8a8"};

var catCounts={};
entities.forEach(function(e){
var c=e.category||"other";
catCounts[c]=(catCounts[c]||0)+1;
});

var activeFilter="all";
var searchQuery="";
var currentPage=1;
var perPage=24;
var viewMode="grid";
var sortMode="relations";

function getSortValue(e,mode){
switch(mode){
case"name":return e.name.toLowerCase();
case"relations":return -(e.relatedEntities||[]).length;
case"articles":return -((e.articleCount&&e.articleCount.low)||0);
case"category":return e.category||"";
default:return -(e.relatedEntities||[]).length;
}
}

function filteredAndSorted(){
var f=entities.filter(function(e){
if(activeFilter!=="all"&&e.category!==activeFilter)return false;
if(searchQuery){
var q=searchQuery.toLowerCase();
return e.name.toLowerCase().indexOf(q)!==-1||(e.relatedEntities||[]).some(function(r){return r.name.toLowerCase().indexOf(q)!==-1});
}
return true;
});
f.sort(function(a,b){
var va=getSortValue(a,sortMode);
var vb=getSortValue(b,sortMode);
if(typeof va==="string")return va.localeCompare(vb);
return va-vb;
});
return f;
}

function getTooltipHtml(e){
var art=(e.articles||[]).slice(0,5);
var total=(e.articleCount&&e.articleCount.low)||e.articles.length;
var h="<strong>"+escapeHtml(e.name)+"</strong>";
h+="<br><span style=\"font-size:0.72rem;color:#667eea;\">"+(catLabels[e.category]||e.category)+"</span>";
h+="<br><span style=\"font-size:0.78rem;\">"+(e.relatedEntities||[]).length+" verwandte Begriffe · "+total+" Artikel</span>";
if(art.length>0){
h+="<hr style=\"margin:0.4rem 0;border:none;border-top:1px solid var(--border-color,#eee);\">";
h+="<div style=\"font-size:0.72rem;\">";
art.forEach(function(a){
h+="<div style=\"padding:0.1rem 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">• "+escapeHtml(a)+"</div>";
});
if(art.length<total)h+="<div style=\"color:#667eea;\">+"+(total-art.length)+" weitere</div>";
h+="</div>";
}
return h;
}

function render(){
var filtered=filteredAndSorted();
var totalPages=Math.ceil(filtered.length/perPage);
if(currentPage>totalPages)currentPage=Math.max(1,totalPages);
var start=(currentPage-1)*perPage;
var pageItems=filtered.slice(start,start+perPage);

var toolbar="<div class=\"entity-toolbar\">";
toolbar+="<div class=\"entity-toolbar-left\">";
toolbar+="<input class=\"entity-search\" type=\"text\" placeholder=\"Begriff suchen...\" id=\"entity-search\" value=\""+escapeHtml(searchQuery)+"\">";
toolbar+="</div>";
toolbar+="<select class=\"entity-sort-select\" id=\"entity-sort\">";
var sortOptions=[{v:"relations",l:"Nach Relevanz"},{v:"name",l:"A–Z"},{v:"articles",l:"Nach Artikelzahl"},{v:"category",l:"Nach Kategorie"}];
sortOptions.forEach(function(o){
toolbar+="<option value=\""+o.v+"\""+(sortMode===o.v?" selected":"")+">"+o.l+"</option>";
});
toolbar+="</select>";
toolbar+="<div class=\"entity-view-controls\">";
toolbar+="<button class=\"entity-view-btn"+(viewMode==="grid"?" active":"")+"\" data-view=\"grid\" title=\"Kachelansicht\">▦</button>";
toolbar+="<button class=\"entity-view-btn"+(viewMode==="cloud"?" active":"")+"\" data-view=\"cloud\" title=\"Schlagwortwolke\">☁</button>";
toolbar+="</div>";
toolbar+="</div>";

var filters="<div class=\"entity-filters\">";
filters+="<button class=\"entity-filter-btn"+(activeFilter==="all"?" active":"")+"\" data-cat=\"all\">Alle <span class=\"entity-filter-count\">"+entities.length+"</span></button>";
Object.keys(catLabels).forEach(function(cat){
if(catCounts[cat]){
filters+="<button class=\"entity-filter-btn"+(activeFilter===cat?" active":"")+"\" data-cat=\""+cat+"\" style=\""+(activeFilter===cat?"background:"+catColors[cat]+";border-color:"+catColors[cat]+";color:#fff":"")+"\">"+catLabels[cat]+" <span class=\"entity-filter-count\">"+catCounts[cat]+"</span></button>";
}
});
filters+="</div>";

var html="<div class=\"entity-header\">";
html+="<h1>Wissensnetz</h1>";
html+="<div class=\"entity-stats\">";
html+="<span><strong>"+entities.length+"</strong> Begriffe</span>";
html+="<span><strong>"+articles.length+"</strong> Dokumente</span>";
html+="<span>"+filtered.length+" angezeigt</span>";
html+="<span><a href=\"/wissennetz/\" class=\"entity-graph-top-link\">Interaktiver Graph →</a></span>";
html+="</div></div>";

html+=toolbar;
html+=filters;

if(viewMode==="cloud"){
html+="<div class=\"entity-tagcloud\">";
filtered.forEach(function(e){
var artCount=(e.articleCount&&e.articleCount.low)||e.articles.length||1;
var size=Math.max(0.8,Math.min(2.5,0.8+artCount*0.15));
var slug=toSlug(e.name);
html+="<a href=\"/entity/"+slug+"/\" class=\"entity-tagcloud-item\" style=\"font-size:"+size+"rem;background:"+(catColors[e.category]||"#667eea")+"\">"+escapeHtml(e.name)+"</a>";
});
html+="</div>";
}else{
html+="<div class=\"entity-grid\">";
if(pageItems.length===0){
html+="<div class=\"empty-state\"><div class=\"empty-state-icon\">🔍</div><p>Keine Begriffe gefunden.</p></div>";
}else{
pageItems.forEach(function(e){
var cat=e.category||"other";
var relatedCount=(e.relatedEntities||[]).length;
var compCount=(e.components||[]).length;
var artCount=(e.articleCount&&e.articleCount.low)||e.articles.length||0;
var slug=toSlug(e.name);
html+="<div class=\"entity-card\" data-cat=\""+cat+"\" data-slug=\""+slug+"\" data-tooltip=\""+escapeHtml(getTooltipHtml(e))+"\">";
html+="<div class=\"entity-card-name\"><a href=\"/entity/"+slug+"/\">"+escapeHtml(e.name)+"</a></div>";
html+="<span class=\"entity-card-cat\">"+(catLabels[cat]||cat)+"</span>";
html+="<div class=\"entity-card-meta\">"+relatedCount+" verwandte Begriffe · "+artCount+" Artikel</div>";
if(e.components&&e.components.length>0){
html+="<div class=\"entity-card-components\"><strong>Besteht aus:</strong> "+e.components.slice(0,5).join(", ")+(e.components.length>5?" +"+(e.components.length-5):"")+"</div>";
}
if(e.relatedEntities&&e.relatedEntities.length>0){
html+="<div class=\"entity-card-related\">";
e.relatedEntities.slice(0,6).forEach(function(r){
html+="<span class=\"entity-related-tag\">"+escapeHtml(r.name)+"</span>";
});
if(e.relatedEntities.length>6)html+="<span class=\"entity-related-tag\">+"+(e.relatedEntities.length-6)+"</span>";
html+="</div>";
}
html+="</div>";
});
}
html+="</div>";
}

if(totalPages>1){
html+="<div class=\"entity-pagination\">";
html+="<button class=\"entity-page-btn\" data-page=\""+(currentPage-1)+"\""+(currentPage<=1?" disabled":"")+">‹</button>";
var startPage=Math.max(1,currentPage-3);
var endPage=Math.min(totalPages,currentPage+3);
for(var p=startPage;p<=endPage;p++){
html+="<button class=\"entity-page-btn"+(p===currentPage?" active":"")+"\" data-page=\""+p+"\">"+p+"</button>";
}
html+="<button class=\"entity-page-btn\" data-page=\""+(currentPage+1)+"\""+(currentPage>=totalPages?" disabled":"")+">›</button>";
html+="</div>";
}

app.innerHTML=html;

document.getElementById("entity-search").addEventListener("input",function(ev){
searchQuery=ev.target.value;
currentPage=1;
render();
});

document.getElementById("entity-sort").addEventListener("change",function(ev){
sortMode=ev.target.value;
currentPage=1;
render();
});

app.querySelectorAll(".entity-view-btn").forEach(function(btn){
btn.addEventListener("click",function(){
viewMode=this.getAttribute("data-view");
currentPage=1;
render();
});
});

app.querySelectorAll(".entity-filter-btn").forEach(function(btn){
btn.addEventListener("click",function(){
activeFilter=this.getAttribute("data-cat");
currentPage=1;
render();
});
});

app.querySelectorAll(".entity-page-btn").forEach(function(btn){
btn.addEventListener("click",function(){
if(btn.disabled)return;
var p=parseInt(btn.getAttribute("data-page"));
if(p>0&&p<=totalPages){
currentPage=p;
render();
}
});
});

var tooltipEl=null;
app.addEventListener("mouseover",function(ev){
var card=ev.target.closest(".entity-card");
if(!card)return;
var tip=card.getAttribute("data-tooltip");
if(!tip)return;
if(!tooltipEl){
tooltipEl=document.createElement("div");
tooltipEl.className="entity-tooltip";
document.body.appendChild(tooltipEl);
}
tooltipEl.innerHTML=tip;
tooltipEl.style.display="block";
});

app.addEventListener("mousemove",function(ev){
if(!tooltipEl)return;
var x=ev.clientX+12;
var y=ev.clientY+12;
var tw=tooltipEl.offsetWidth;
var th=tooltipEl.offsetHeight;
if(x+tw>window.innerWidth-10)x=ev.clientX-tw-12;
if(y+th>window.innerHeight-10)y=ev.clientY-th-12;
tooltipEl.style.left=x+"px";
tooltipEl.style.top=y+"px";
});

app.addEventListener("mouseout",function(ev){
var card=ev.target.closest(".entity-card");
if(!card)return;
if(tooltipEl)tooltipEl.style.display="none";
});
}

})();
</script>

{{ end }}
