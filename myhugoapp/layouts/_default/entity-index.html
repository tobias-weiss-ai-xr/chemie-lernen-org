<script>
(function() {
  var filterBtns = document.querySelectorAll('.filter-btn');
  var cards = document.querySelectorAll('.entity-card-wrapper');
  var searchInput = document.getElementById('entity-search-input');

  function filterEntities() {
    var activeFilter = document.querySelector('.filter-btn.active');
    var filter = activeFilter ? activeFilter.getAttribute('data-filter') : 'all';
    var query = searchInput ? searchInput.value.toLowerCase().trim() : '';

    cards.forEach(function(card) {
      var type = card.getAttribute('data-entity-type');
      var name = card.getAttribute('data-entity-name');
      var showByType = filter === 'all' || type === filter;
      var showBySearch = !query || name.indexOf(query) !== -1;
      card.style.display = (showByType && showBySearch) ? '' : 'none';
    });
  }

  filterBtns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      filterBtns.forEach(function(b) { b.classList.remove('active'); });
      this.classList.add('active');
      filterEntities();
    });
  });

  if (searchInput) {
    searchInput.addEventListener('input', filterEntities);
  }
})();

.entity-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 1rem;

.entity-card {
  background: var(--bg-card, #fff);
  border: 1px solid var(--border-color, #e0e0e0);
  border-radius: 10px; padding: 1.2rem;
  cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  position: relative; overflow: hidden;
}
.entity-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 16px rgba(0,0,0,0.12);

.entity-card:active { transform: translateY(-1px); }
.entity-card::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0;
  height: 3px; border-radius: 10px 10px 0 0;
}
.entity-card[data-cat="stoff"]::before { background: #667eea; }
.entity-card[data-cat="konzept"]::before { background: #45b7d1; }
.entity-card[data-cat="reaktion"]::before { background: #4ecdc4; }
.entity-card[data-cat="methode"]::before { background: #f093fb; }

.entity-card[data-cat="quelle"]::before { background: #a8a8a8; }

  font-size: 1.15rem; font-weight: 600; margin: 0 0 0.4rem 0;

  color: inherit; text-decoration: none;
}
