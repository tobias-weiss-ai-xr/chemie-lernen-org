{{ define "css" }}
<style>
#curricula-app { margin-top: 1rem; margin-bottom: 2rem; min-height: 400px; }

/* Header */
.curricula-header {
  display: flex; flex-wrap: wrap; align-items: center; gap: 1rem;
  margin-bottom: 1rem; padding-bottom: 1rem;
  border-bottom: 2px solid var(--border-color, #e0e0e0);
}
.curricula-header h1 { margin: 0; flex: 1; font-size: 1.6rem; }
.curricula-subtitle { margin: 0; color: var(--text-muted, #666); width: 100%; }

/* Tabs */
.curricula-tabs {
  display: flex; gap: 0.25rem; margin: 1rem 0 1.25rem;
  border-bottom: 2px solid var(--border-color, #e0e0e0);
}
.curricula-tab {
  padding: 0.6rem 1.1rem; border: none; background: none;
  font-size: 1rem; cursor: pointer; color: var(--text-muted, #666);
  border-bottom: 3px solid transparent; margin-bottom: -2px;
  transition: color 0.2s, border-color 0.2s;
}
.curricula-tab:hover { color: #9b59b6; }
.curricula-tab.active {
  color: #7b1fa2; font-weight: 600; border-bottom-color: #9b59b6;
}
.curricula-tab-panel { margin-bottom: 2rem; }
.curricula-tab-panel[hidden] { display: none; }

/* Summary stats bar */
.curricula-summary {
  display: flex; flex-wrap: wrap; gap: 1.5rem;
  margin: 0.5rem 0 1rem; padding: 0.85rem 1.1rem;
  background: linear-gradient(135deg, #f3e8ff 0%, #ede7f6 100%);
  border: 1px solid #e1d5f0; border-radius: 10px;
}
.curricula-stat { display: flex; flex-direction: column; line-height: 1.15; }
.curricula-stat-num { font-size: 1.5rem; font-weight: 700; color: #7b1fa2; }
.curricula-stat-label { font-size: 0.78rem; color: var(--text-muted, #666); }

/* Compare bar */
.curricula-compare-bar {
  display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
  margin-bottom: 1rem;
}
.curricula-compare-toggle {
  display: inline-flex; align-items: center; gap: 0.4rem;
  font-size: 0.92rem; cursor: pointer; color: var(--text-primary, #333);
}
.curricula-compare-hint { font-size: 0.82rem; color: var(--text-muted, #888); }

/* Filter bar (school type + grade) */
.curricula-filter-bar {
  display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
  margin-bottom: 1rem; padding: 0.6rem 0.9rem;
  background: var(--bg-card, #f8f9fa); border: 1px solid var(--border-color, #e0e0e0);
  border-radius: 8px;
}
.curricula-filter-bar[hidden] { display: none; }
.curricula-filter-field {
  font-size: 0.9rem; color: var(--text-primary, #333);
  display: inline-flex; align-items: center; gap: 0.35rem;
}
.curricula-filter-field select {
  padding: 0.35rem 0.55rem; border-radius: 6px;
  border: 1px solid var(--border-color, #ddd); font-size: 0.88rem;
  background: var(--bg-input, #fff); color: var(--text-primary, #333);
}
.curricula-filter-count { font-size: 0.8rem; color: var(--text-muted, #888); margin-left: auto; }
.curricula-topic-link { color: #9b59b6; text-decoration: none; }
.curricula-topic-link:hover { text-decoration: underline; }

/* Card grid */
.curricula-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 1rem;
}
.curricula-state-card {
  display: block; width: 100%; text-align: left;
  background: var(--bg-card, #fff); border: 1px solid var(--border-color, #e0e0e0);
  border-left: 4px solid #9b59b6; border-radius: 10px;
  padding: 0.9rem 1rem; cursor: pointer; color: inherit;
  font: inherit; transition: box-shadow 0.18s, transform 0.18s, border-color 0.18s;
}
.curricula-state-card:hover {
  box-shadow: 0 4px 14px rgba(155, 89, 182, 0.18);
  transform: translateY(-2px); border-color: #9b59b6;
}
.curricula-card-top {
  display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem;
  margin-bottom: 0.5rem;
}
.curricula-card-name { font-size: 1.05rem; font-weight: 700; }
.curricula-card-code {
  font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em;
  background: #9b59b6; color: #fff; border-radius: 6px; padding: 2px 7px;
}
.curricula-card-stats {
  display: flex; flex-wrap: wrap; gap: 0.35rem; font-size: 0.82rem;
  color: var(--text-muted, #555); margin-bottom: 0.5rem;
}
.curricula-card-stats .sep { color: #ccc; }
.curricula-card-tags { display: flex; flex-wrap: wrap; gap: 0.3rem; }
.curricula-card-tags .tag {
  font-size: 0.72rem; background: #f3e8ff; color: #7b1fa2;
  border-radius: 8px; padding: 1px 8px;
}
.curricula-state-card.zero-topics {
  border-left-color: #bbb; opacity: 0.72; background: #fafafa;
}
.curricula-state-card.zero-topics .curricula-card-code { background: #999; }

/* Per-card compare checkbox (only shown in compare mode) */
.curricula-card-compare {
  display: none; margin-top: 0.6rem; font-size: 0.8rem;
  align-items: center; gap: 0.35rem; color: var(--text-muted, #666);
}
.curricula-grid.compare-mode .curricula-card-compare { display: flex; }
.curricula-state-card.selected { outline: 2px solid #9b59b6; outline-offset: 1px; }

/* Compare panel */
.curricula-compare-panel {
  margin-top: 1.25rem; padding: 1rem 1.1rem;
  background: var(--bg-card, #fff); border: 1px solid var(--border-color, #e0e0e0);
  border-radius: 10px;
}
.curricula-compare-panel[hidden] { display: none; }
.curricula-compare-panel h3 { margin: 0 0 0.4rem; font-size: 1.1rem; color: #7b1fa2; }
.curricula-compare-summary {
  font-size: 0.85rem; color: var(--text-muted, #666); margin-bottom: 0.75rem;
}
.curricula-compare-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
.curricula-compare-table th, .curricula-compare-table td {
  text-align: left; padding: 0.35rem 0.5rem; border-bottom: 1px solid var(--border-color, #eee);
}
.curricula-compare-table th { color: var(--text-muted, #666); font-weight: 600; }
.curricula-compare-table td.yes { color: #2e7d32; font-weight: 700; text-align: center; }
.curricula-compare-table td.no { color: #ccc; text-align: center; }
.curricula-compare-empty { color: var(--text-muted, #888); font-size: 0.88rem; }

/* Graph toolbar */
.curricula-toolbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem;
  margin-bottom: 1rem; padding: 0.75rem 1rem;
  background: var(--bg-card, #f8f9fa);
  border: 1px solid var(--border-color, #e0e0e0);
  border-radius: 8px;
}
.curricula-scope-group { display: flex; gap: 0.25rem; }
.curricula-scope-btn {
  padding: 0.45rem 0.9rem; border: 1px solid var(--border-color, #ddd);
  background: var(--bg-input, #fff); color: var(--text-primary, #333);
  border-radius: 6px; cursor: pointer; font-size: 0.88rem;
  transition: background 0.2s, border-color 0.2s, color 0.2s;
}
.curricula-scope-btn:hover { border-color: #9b59b6; }
.curricula-scope-btn.active {
  background: #9b59b6; color: #fff; border-color: #9b59b6; font-weight: 600;
}
.curricula-toolbar select {
  padding: 0.45rem 0.6rem; border-radius: 6px;
  border: 1px solid var(--border-color, #ddd); font-size: 0.88rem;
  background: var(--bg-input, #fff); color: var(--text-primary, #333);
  max-width: 220px;
}
.curricula-search {
  flex: 1; min-width: 180px; padding: 0.45rem 0.7rem;
  border: 1px solid var(--border-color, #ddd); border-radius: 6px;
  font-size: 0.9rem; background: var(--bg-input, #fff);
  color: var(--text-primary, #333);
}
.curricula-fit-btn {
  padding: 0.45rem 0.9rem; border: 1px solid var(--border-color, #ddd);
  background: var(--bg-input, #fff); color: var(--text-primary, #333);
  border-radius: 6px; cursor: pointer; font-size: 0.88rem;
}
.curricula-fit-btn:hover { border-color: #9b59b6; }

/* Graph + detail layout */
.curricula-graph-wrap { display: flex; gap: 1rem; align-items: stretch; }
#curricula-graph {
  flex: 1; min-height: 620px; height: 65vh;
  border: 1px solid var(--border-color, #e0e0e0);
  border-radius: 8px; background: var(--bg-card, #fff);
  overflow: hidden; position: relative;
}
#curricula-node-details {
  width: 320px; max-width: 40vw; padding: 1rem;
  border: 1px solid var(--border-color, #e0e0e0); border-radius: 8px;
  background: var(--bg-card, #fff); height: 65vh; overflow-y: auto;
  display: none; position: relative;
}
.curricula-details-close {
  position: absolute; top: 0.5rem; right: 0.75rem;
  background: none; border: none; font-size: 1.4rem; cursor: pointer;
  color: var(--text-muted, #666); line-height: 1;
}
.curricula-details-close:hover { color: #e74c3c; }
.curricula-detail-type {
  display: inline-block; padding: 2px 8px; border-radius: 10px;
  background: #f3e8ff; color: #7b1fa2; font-size: 0.75rem; font-weight: 600;
  margin-bottom: 0.5rem;
}
.curricula-detail-row {
  display: flex; gap: 0.5rem; padding: 0.3rem 0;
  border-bottom: 1px solid var(--border-color, #eee); font-size: 0.85rem;
}
.curricula-detail-k { color: var(--text-muted, #666); min-width: 90px; }
.curricula-detail-v { flex: 1; word-break: break-word; }
.curricula-detail-links { margin-top: 0.75rem; font-size: 0.85rem; }
.curricula-detail-links a { color: #9b59b6; }

/* Legend */
.curricula-legend {
  display: flex; flex-wrap: wrap; gap: 0.5rem 1rem;
  margin-top: 0.75rem; font-size: 0.8rem; color: var(--text-muted, #666);
}
.curricula-legend-item { display: inline-flex; align-items: center; gap: 0.35rem; }
.curricula-legend-dot {
  width: 11px; height: 11px; border-radius: 50%; display: inline-block;
  border: 1px solid rgba(0,0,0,0.15);
}

/* Curriculum overview list (legacy graph sidebar, kept for compatibility) */
.curricula-overview {
  margin-bottom: 1rem; padding: 0.75rem 1rem;
  background: var(--bg-card, #f8f9fa);
  border: 1px solid var(--border-color, #e0e0e0); border-radius: 8px;
}
.curricula-ov-head { font-weight: 600; font-size: 0.95rem; margin-bottom: 0.5rem; color: #7b1fa2; }
.curricula-ov-list { display: flex; flex-direction: column; gap: 2px; max-height: 360px; overflow-y: auto; }
.curricula-ov-state { border-bottom: 1px solid var(--border-color, #eee); }
.curricula-ov-state:last-child { border-bottom: none; }
.curricula-ov-state-head {
  width: 100%; display: flex; align-items: center; justify-content: space-between;
  background: none; border: none; cursor: pointer; padding: 0.4rem 0.2rem;
  font-size: 0.9rem; color: var(--text-primary, #333); text-align: left;
}
.curricula-ov-state-head:hover { color: #9b59b6; }
.curricula-ov-state-count {
  background: #9b59b6; color: #fff; font-size: 0.7rem; font-weight: 700;
  border-radius: 10px; padding: 1px 7px; min-width: 20px; text-align: center;
}
.curricula-ov-curricula { display: none; flex-direction: column; padding: 0 0 0.4rem 1rem; gap: 2px; }
.curricula-ov-state.open .curricula-ov-curricula { display: flex; }
.curricula-ov-cur {
  display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
  background: var(--bg-input, #fff); border: 1px solid var(--border-color, #ddd);
  border-radius: 6px; padding: 0.35rem 0.6rem; cursor: pointer; font-size: 0.84rem;
  color: var(--text-primary, #333); text-align: left;
}
.curricula-ov-cur:hover { border-color: #9b59b6; background: #f3e8ff; }
.curricula-ov-cur-name { font-weight: 500; }
.curricula-ov-cur-meta { color: var(--text-muted, #888); font-size: 0.76rem; }
.curricula-overview-empty { color: var(--text-muted, #888); font-size: 0.85rem; }
.curricula-ov-cur.selected { border-color: #7b1fa2; background: #f3e8ff; font-weight: 600; }
.curricula-ov-state-head.selected { color: #7b1fa2; font-weight: 700; }

/* Loading / empty states */
.curricula-loading, .empty-state {
  text-align: center; padding: 3rem 1rem; color: var(--text-muted, #888);
}
.empty-state-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }

/* Skeleton */
.curricula-skeleton {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 1rem;
}
.curricula-skeleton-card {
  height: 100px; border-radius: 10px;
  background: linear-gradient(90deg, #eee 25%, #f5f5f5 50%, #eee 75%);
  background-size: 200% 100%; animation: shim 1.5s infinite;
}
@keyframes shim { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* Dark mode */
@media (prefers-color-scheme: dark) {
  .curricula-tab { color: #aaa; }
  .curricula-tab:hover { color: #bb86fc; }
  .curricula-tab.active { color: #ce93d8; border-bottom-color: #bb86fc; }
  .curricula-summary { background: #2a2440; border-color: #3a2f55; }
  .curricula-stat-num { color: #ce93d8; }
  .curricula-state-card { background: #2a2a2a; border-color: #444; }
  .curricula-state-card:hover { border-color: #bb86fc; }
  .curricula-card-code { background: #bb86fc; color: #000; }
  .curricula-card-tags .tag { background: #3a2060; color: #ce93d8; }
  .curricula-state-card.zero-topics { background: #242424; border-left-color: #555; }
  .curricula-state-card.zero-topics .curricula-card-code { background: #666; }
  .curricula-compare-panel { background: #2a2a2a; border-color: #444; }
  .curricula-filter-bar { background: #2a2a2a; border-color: #444; }
  .curricula-filter-field { color: #e0e0e0; }
  .curricula-filter-field select { background: #333; border-color: #555; color: #e0e0e0; }
  .curricula-topic-link { color: #ce93d8; }
  .curricula-toolbar { background: #2a2a2a; border-color: #444; }
  .curricula-scope-btn { background: #333; border-color: #555; color: #e0e0e0; }
  .curricula-scope-btn:hover { border-color: #bb86fc; }
  .curricula-scope-btn.active { background: #bb86fc; color: #000; border-color: #bb86fc; }
  .curricula-toolbar select, .curricula-search {
    background: #333; border-color: #555; color: #e0e0e0;
  }
  .curricula-fit-btn { background: #333; border-color: #555; color: #e0e0e0; }
  .curricula-fit-btn:hover { border-color: #bb86fc; }
  #curricula-graph, #curricula-node-details {
    background: #2a2a2a; border-color: #444;
  }
  .curricula-detail-type { background: #3a2060; color: #ce93d8; }
  .curricula-detail-row { border-bottom-color: #333; }
  .curricula-skeleton-card {
    background: linear-gradient(90deg, #333 25%, #3a3a3a 50%, #333 75%);
    background-size: 200% 100%;
  }
  .curricula-overview { background: #2a2a2a; border-color: #444; }
  .curricula-ov-head { color: #ce93d8; }
  .curricula-ov-state { border-bottom-color: #333; }
  .curricula-ov-state-head { color: #e0e0e0; }
  .curricula-ov-state-head:hover { color: #bb86fc; }
  .curricula-ov-cur { background: #333; border-color: #555; color: #e0e0e0; }
  .curricula-ov-cur:hover { border-color: #bb86fc; background: #3a2060; }
  .curricula-ov-cur-meta { color: #999; }
  .curricula-ov-cur.selected { border-color: #bb86fc; background: #3a2060; }
  .curricula-ov-state-head.selected { color: #bb86fc; }
}

/* Responsive */
@media (max-width: 768px) {
  .curricula-graph-wrap { flex-direction: column; }
  #curricula-graph { min-height: 460px; height: 60vh; }
  #curricula-node-details { width: 100%; max-width: none; height: auto; max-height: 50vh; }
}
</style>
{{ end }}

{{ define "main" }}
<div class="container" style="margin-top: 1rem;">
  {{ partial "breadcrumbs.html" . }}
  <div class="row">
    <div class="col-md-12">
      <h1>{{ .Title }}</h1>
    </div>
  </div>

  <div class="row">
    <div class="col-md-12">
      {{ .Content }}
    </div>
  </div>

  <div class="curricula-tabs" role="tablist" aria-label="Lehrpläne Ansicht">
    <button class="curricula-tab active" id="tab-btn-overview" role="tab" aria-selected="true" aria-controls="tab-overview" type="button">Übersicht</button>
    <button class="curricula-tab" id="tab-btn-advanced" role="tab" aria-selected="false" aria-controls="tab-advanced" type="button">Erweitert (Graph)</button>
  </div>

  <!-- Übersicht (default): card grid + comparison -->
  <div id="tab-overview" class="curricula-tab-panel" role="tabpanel" aria-labelledby="tab-btn-overview">
    <div class="curricula-summary" id="curricula-summary" aria-live="polite"></div>

    <div class="curricula-compare-bar">
      <label class="curricula-compare-toggle">
        <input type="checkbox" id="curricula-compare-check" /> Bundesländer vergleichen
      </label>
      <span class="curricula-compare-hint" id="curricula-compare-hint">2–3 Länder auswählen, um Themen zu vergleichen.</span>
    </div>

    <div class="curricula-filter-bar" id="curricula-filter-bar" hidden>
      <label class="curricula-filter-field">Schulform:
        <select id="curricula-filter-school" aria-label="Schulform filtern"><option value="">Alle</option></select>
      </label>
      <label class="curricula-filter-field">Klasse:
        <select id="curricula-filter-grade" aria-label="Klasse filtern"><option value="">Alle</option></select>
      </label>
      <span class="curricula-filter-count" id="curricula-filter-count"></span>
    </div>

    <div id="curricula-grid" class="curricula-grid" aria-label="Bundesländer-Lehrpläne" aria-live="polite" aria-relevant="additions removals">
      <div class="curricula-skeleton" id="curricula-skeleton" aria-label="Lade Lehrpläne…">
        <div class="curricula-skeleton-card"></div>
        <div class="curricula-skeleton-card"></div>
        <div class="curricula-skeleton-card"></div>
        <div class="curricula-skeleton-card"></div>
        <div class="curricula-skeleton-card"></div>
        <div class="curricula-skeleton-card"></div>
      </div>
    </div>

    <div class="curricula-compare-panel" id="curricula-compare-panel" hidden></div>
  </div>

  <!-- Erweitert: Cytoscape graph (lazy-initialised when shown) -->
  <div id="tab-advanced" class="curricula-tab-panel" role="tabpanel" aria-labelledby="tab-btn-advanced" hidden>
    <div id="curricula-app">
      <div id="curricula-toolbar-template" hidden>
        <div class="curricula-toolbar">
          <div class="curricula-scope-group" role="group" aria-label="Ansicht">
            <button class="curricula-scope-btn" data-scope="all" type="button">Alle</button>
            <button class="curricula-scope-btn" data-scope="universities" type="button">Universitäten</button>
            <button class="curricula-scope-btn active" data-scope="curriculum" type="button">Lehrpläne</button>
          </div>
          <select id="curricula-state-select" aria-label="Bundesland filtern">
            <option value="">Alle Bundesländer</option>
          </select>
          <select id="curricula-uni-select" aria-label="Universität filtern">
            <option value="">Alle Universitäten</option>
          </select>
          <input type="search" id="curricula-search" class="curricula-search"
            placeholder="Suche im Graphen…" aria-label="Suche im Graphen">
          <button type="button" class="curricula-fit-btn" id="curricula-fit">⤢ Anpassen</button>
        </div>
        <div class="curricula-graph-wrap">
          <div id="curricula-graph" role="img" aria-label="Interaktiver Graph der Lehrplan- und Modulhandbuch-Daten"></div>
          <div id="curricula-node-details" role="complementary" aria-label="Details zum ausgewählten Knoten">
            <button class="curricula-details-close" id="curricula-details-close" aria-label="Details schließen">&times;</button>
            <div id="curricula-details-content"></div>
          </div>
        </div>
        <div class="curricula-legend" aria-label="Legende">
          <span class="curricula-legend-item"><span class="curricula-legend-dot" style="background:#9C27B0"></span>Universität</span>
          <span class="curricula-legend-item"><span class="curricula-legend-dot" style="background:#2196F3"></span>Modul</span>
          <span class="curricula-legend-item"><span class="curricula-legend-dot" style="background:#4CAF50"></span>Lehrplan</span>
          <span class="curricula-legend-item"><span class="curricula-legend-dot" style="background:#8BC34A"></span>Thema</span>
          <span class="curricula-legend-item"><span class="curricula-legend-dot" style="background:#FF9800"></span>Teilthema</span>
          <span class="curricula-legend-item"><span class="curricula-legend-dot" style="background:#F44336"></span>Lernziel</span>
          <span class="curricula-legend-item"><span class="curricula-legend-dot" style="background:#E91E63"></span>Konzept</span>
          <span class="curricula-legend-item"><span class="curricula-legend-dot" style="background:#795548"></span>Inhalt</span>
        </div>
      </div>
    </div>
  </div>
</div>
{{ end }}

{{ define "js" }}
<script src="{{ "/js/curricula-overview.js" | relURL }}?v=1"></script>
<script src="{{ "/js/curricula-index.js" | relURL }}?v=8"></script>
{{ end }}
