{{ $url := .Permalink }}
{{ $title := .Title }}
{{ $description := .Description | default .Site.Params.footer_description }}
{{ $encodedUrl := querify "q" $url | strings.TrimPrefix "q=" }}
{{ $encodedTitle := querify "q" $title | strings.TrimPrefix "q=" }}

<div class="social-share-bar">
  <p><strong>Diesen Beitrag teilen:</strong></p>
  <p class="social-share-links">
    <!-- Twitter/X -->
    <a href="https://twitter.com/intent/tweet?text={{ $encodedTitle }}&url={{ $encodedUrl }}" target="_blank" rel="noopener noreferrer" class="social-share-link" aria-label="Auf Twitter/X teilen">
      🐦
    </a>
    <!-- LinkedIn -->
    <a href="https://www.linkedin.com/shareArticle?mini=true&url={{ $encodedUrl }}&title={{ $encodedTitle }}&summary={{ $description }}" target="_blank" rel="noopener noreferrer" class="social-share-link" aria-label="Auf LinkedIn teilen">
      💼
    </a>
    <!-- WhatsApp -->
    <a href="https://api.whatsapp.com/send?text={{ $encodedTitle }}%20{{ $encodedUrl }}" target="_blank" rel="noopener noreferrer" class="social-share-link" aria-label="Per WhatsApp teilen">
      💬
    </a>
    <!-- Mastodon -->
    <a href="https://toot.kytta.dev/?text={{ $encodedTitle }}%20{{ $encodedUrl }}" target="_blank" rel="noopener noreferrer" class="social-share-link" aria-label="Auf Mastodon teilen">
      🐘
    </a>
    <!-- E-Mail -->
    <a href="mailto:?subject={{ $title }}&body={{ $title }}%0A{{ $url }}" class="social-share-link" aria-label="Per E-Mail teilen">
      ✉️
    </a>
    <!-- Copy link -->
    <a href="#" id="copy-link-btn" class="social-share-link" aria-label="Link kopieren">
      🔗
    </a>
  </p>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
  var copyBtn = document.getElementById('copy-link-btn');
  if (copyBtn) {
    copyBtn.addEventListener('click', function(e) {
      e.preventDefault();
      navigator.clipboard.writeText('{{ $url }}').then(function() {
        alert('Link kopiert!');
      });
    });
  }
});
</script>
